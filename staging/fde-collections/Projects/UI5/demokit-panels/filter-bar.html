<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <script src="panel-init.js"></script>
  <script type="module" src="../../../lib/ui5-bundle/ui5-bundle.js"></script>
  <style>
    @font-face { font-family: "72"; font-weight: 400; src: url("https://cdn.jsdelivr.net/npm/@sap-theming/theming-base-content@11.33.0/content/Base/baseLib/baseTheme/fonts/72-Regular.woff2") format("woff2"); }
    @font-face { font-family: "72"; font-weight: 700; src: url("https://cdn.jsdelivr.net/npm/@sap-theming/theming-base-content@11.33.0/content/Base/baseLib/baseTheme/fonts/72-Bold.woff2") format("woff2"); }
    @font-face { font-family: "72"; font-weight: 600; src: url("https://cdn.jsdelivr.net/npm/@sap-theming/theming-base-content@11.33.0/content/Base/baseLib/baseTheme/fonts/72-Semibold.woff2") format("woff2"); }
    @font-face { font-family: "72"; font-weight: 300; src: url("https://cdn.jsdelivr.net/npm/@sap-theming/theming-base-content@11.33.0/content/Base/baseLib/baseTheme/fonts/72-Light.woff2") format("woff2"); }
    body { font-family: "72", sans-serif; font-size: 0.875rem; background: #f5f6f7; color: #131e29; margin: 0; padding: 2rem; }
    .panel-title { font-size: 1.25rem; font-weight: 700; margin-bottom: 0.25rem; }
    .panel-subtitle { font-size: 0.875rem; color: #6a7588; margin-bottom: 2rem; }
    .demo-section { margin-bottom: 2rem; }
    .demo-section-header { font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: #6a7588; margin-bottom: 1rem; padding-bottom: 0.375rem; border-bottom: 1px solid #e5e5e5; }
    .demo-section-body { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 0.75rem; }
    ui5-button { --sapButton_FontFamily: "72", sans-serif; }
    ui5-button::part(text) { font-family: "72", sans-serif; font-weight: 400; }
    .fb-result { margin-top: 0.75rem; font-size: 0.8125rem; color: #6a7588; font-style: italic; }
  </style>
</head>
<body>

  <div class="panel-title">Filter Bar</div>
  <div class="panel-subtitle">A structured filter area with labelled fields, Go button, and a collapsible layout. Placed above a table in a List Report.</div>

  <div class="demo-section">
    <div class="demo-section-header">Standard Filter Bar</div>
    <div class="demo-section-body" style="width:100%; flex-direction:column;">
      <ui5-filter-bar id="fb-demo" show-go-on-fb header="Filters">

        <ui5-filter-item label="Product Name" required>
          <ui5-input slot="filter" id="fb-product" placeholder="Search products…" show-clear-icon></ui5-input>
        </ui5-filter-item>

        <ui5-filter-item label="Category">
          <ui5-select slot="filter" id="fb-category">
            <ui5-option value="">All</ui5-option>
            <ui5-option value="notebooks">Notebooks</ui5-option>
            <ui5-option value="tablets">Tablets</ui5-option>
            <ui5-option value="accessories">Accessories</ui5-option>
          </ui5-select>
        </ui5-filter-item>

        <ui5-filter-item label="Supplier">
          <ui5-select slot="filter" id="fb-supplier">
            <ui5-option value="">All</ui5-option>
            <ui5-option value="lenovo">Lenovo</ui5-option>
            <ui5-option value="hp">HP</ui5-option>
            <ui5-option value="dell">Dell</ui5-option>
          </ui5-select>
        </ui5-filter-item>

        <ui5-filter-item label="Availability">
          <ui5-select slot="filter" id="fb-avail">
            <ui5-option value="">All</ui5-option>
            <ui5-option value="available">Available</ui5-option>
            <ui5-option value="low">Low Stock</ui5-option>
            <ui5-option value="out">Out of Stock</ui5-option>
          </ui5-select>
        </ui5-filter-item>

      </ui5-filter-bar>
      <div id="fb-result" class="fb-result">Press Go to apply filters.</div>
    </div>
  </div>

  <script>
    document.getElementById('fb-demo').addEventListener('go', function() {
      var product = document.getElementById('fb-product').value;
      var cat = document.getElementById('fb-category').selectedOption && document.getElementById('fb-category').selectedOption.textContent;
      var sup = document.getElementById('fb-supplier').selectedOption && document.getElementById('fb-supplier').selectedOption.textContent;
      var parts = [];
      if (product) parts.push('Product: "' + product + '"');
      if (cat && cat !== 'All') parts.push('Category: ' + cat);
      if (sup && sup !== 'All') parts.push('Supplier: ' + sup);
      var el = document.getElementById('fb-result');
      el.textContent = parts.length ? 'Filtering by — ' + parts.join(' · ') : 'No filters applied — showing all results.';
      el.style.color = parts.length ? '#196800' : '#6a7588';
      el.style.fontStyle = 'normal';
    });
  </script>

</body>
</html>
