<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <script src="panel-init.js"></script>
  <script type="module" src="../../../lib/ui5-bundle/ui5-bundle.js"></script>
  <style>
    @font-face { font-family: "72"; font-weight: 400; src: url("https://cdn.jsdelivr.net/npm/@sap-theming/theming-base-content@11.33.0/content/Base/baseLib/baseTheme/fonts/72-Regular.woff2") format("woff2"); }
    @font-face { font-family: "72"; font-weight: 700; src: url("https://cdn.jsdelivr.net/npm/@sap-theming/theming-base-content@11.33.0/content/Base/baseLib/baseTheme/fonts/72-Bold.woff2") format("woff2"); }
    @font-face { font-family: "72"; font-weight: 600; src: url("https://cdn.jsdelivr.net/npm/@sap-theming/theming-base-content@11.33.0/content/Base/baseLib/baseTheme/fonts/72-Semibold.woff2") format("woff2"); }
    @font-face { font-family: "72"; font-weight: 300; src: url("https://cdn.jsdelivr.net/npm/@sap-theming/theming-base-content@11.33.0/content/Base/baseLib/baseTheme/fonts/72-Light.woff2") format("woff2"); }
    body { font-family: "72", sans-serif; font-size: 0.875rem; background: #f5f6f7; color: #131e29; margin: 0; padding: 2rem; }
    .panel-title { font-size: 1.25rem; font-weight: 700; margin-bottom: 0.25rem; }
    .panel-subtitle { font-size: 0.875rem; color: #6a7588; margin-bottom: 2rem; }
    .demo-section { margin-bottom: 2rem; }
    .demo-section-header { font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: #6a7588; margin-bottom: 1rem; padding-bottom: 0.375rem; border-bottom: 1px solid #e5e5e5; }
    .demo-section-body { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 0.75rem; }
    ui5-button { --sapButton_FontFamily: "72", sans-serif; }
    ui5-button::part(text) { font-family: "72", sans-serif; font-weight: 400; }
  </style>
</head>
<body>

  <div class="panel-title">Tree</div>
  <div class="panel-subtitle">A hierarchical list with expandable and collapsible nodes. Supports single and multi-selection.</div>

  <div class="demo-section">
    <div class="demo-section-header">Hierarchical Tree</div>
    <div class="demo-section-body" style="width:100%;">
      <ui5-tree style="width:100%;">
        <ui5-tree-item expanded text="Products">
          <ui5-tree-item expanded text="Electronics">
            <ui5-tree-item text="Laptops"></ui5-tree-item>
            <ui5-tree-item text="Smartphones"></ui5-tree-item>
            <ui5-tree-item text="Tablets"></ui5-tree-item>
          </ui5-tree-item>
          <ui5-tree-item text="Clothing">
            <ui5-tree-item text="Men's"></ui5-tree-item>
            <ui5-tree-item text="Women's"></ui5-tree-item>
          </ui5-tree-item>
          <ui5-tree-item text="Home &amp; Garden"></ui5-tree-item>
        </ui5-tree-item>
        <ui5-tree-item text="Suppliers">
          <ui5-tree-item text="Jologa"></ui5-tree-item>
          <ui5-tree-item text="Lyngbysild"></ui5-tree-item>
          <ui5-tree-item text="DelBont Industries"></ui5-tree-item>
        </ui5-tree-item>
        <ui5-tree-item text="Locations">
          <ui5-tree-item text="Europe"></ui5-tree-item>
          <ui5-tree-item text="Americas"></ui5-tree-item>
          <ui5-tree-item text="APJ"></ui5-tree-item>
        </ui5-tree-item>
      </ui5-tree>
    </div>
  </div>

  <div class="demo-section">
    <div class="demo-section-header">With Icons</div>
    <div class="demo-section-body" style="width:100%;">
      <ui5-tree style="width:100%;">
        <ui5-tree-item expanded text="Organisation" icon="org-chart">
          <ui5-tree-item expanded text="Engineering" icon="group">
            <ui5-tree-item text="Frontend" icon="employee"></ui5-tree-item>
            <ui5-tree-item text="Backend" icon="employee"></ui5-tree-item>
            <ui5-tree-item text="DevOps" icon="employee"></ui5-tree-item>
          </ui5-tree-item>
          <ui5-tree-item text="Product" icon="group">
            <ui5-tree-item text="Design" icon="employee"></ui5-tree-item>
            <ui5-tree-item text="Management" icon="employee"></ui5-tree-item>
          </ui5-tree-item>
        </ui5-tree-item>
      </ui5-tree>
    </div>
  </div>

</body>
</html>
