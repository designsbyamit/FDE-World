<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <script src="panel-init.js"></script>
  <script type="module" src="../../../lib/ui5-bundle/ui5-bundle.js"></script>
  <style>
    @font-face { font-family: "72"; font-weight: 400; src: url("https://cdn.jsdelivr.net/npm/@sap-theming/theming-base-content@11.33.0/content/Base/baseLib/baseTheme/fonts/72-Regular.woff2") format("woff2"); }
    @font-face { font-family: "72"; font-weight: 700; src: url("https://cdn.jsdelivr.net/npm/@sap-theming/theming-base-content@11.33.0/content/Base/baseLib/baseTheme/fonts/72-Bold.woff2") format("woff2"); }
    @font-face { font-family: "72"; font-weight: 600; src: url("https://cdn.jsdelivr.net/npm/@sap-theming/theming-base-content@11.33.0/content/Base/baseLib/baseTheme/fonts/72-Semibold.woff2") format("woff2"); }
    @font-face { font-family: "72"; font-weight: 300; src: url("https://cdn.jsdelivr.net/npm/@sap-theming/theming-base-content@11.33.0/content/Base/baseLib/baseTheme/fonts/72-Light.woff2") format("woff2"); }
    body { font-family: "72", sans-serif; font-size: 0.875rem; background: #f5f6f7; color: #131e29; margin: 0; padding: 2rem; }
    .panel-title { font-size: 1.25rem; font-weight: 700; margin-bottom: 0.25rem; }
    .panel-subtitle { font-size: 0.875rem; color: #6a7588; margin-bottom: 2rem; }
    .demo-section { margin-bottom: 2rem; }
    .demo-section-header { font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: #6a7588; margin-bottom: 1rem; padding-bottom: 0.375rem; border-bottom: 1px solid #e5e5e5; }
    .demo-section-body { display: flex; flex-wrap: wrap; align-items: center; gap: 0.75rem; }
    ui5-button { --sapButton_FontFamily: "72", sans-serif; }
    ui5-button::part(text) { font-family: "72", sans-serif; font-weight: 400; }
  </style>
</head>
<body>

  <div class="panel-title">Carousel</div>
  <div class="panel-subtitle">A looping content slider with navigation arrows and page indicators.</div>

  <div class="demo-section">
    <div class="demo-section-header">Image Gallery</div>
    <div class="demo-section-body" style="width:100%;">
      <ui5-carousel cyclic style="height:300px; width:100%;">
        <div style="display:flex;align-items:center;justify-content:center;height:100%;background:#e8edf2;border-radius:6px;">
          <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/8/87/Logitech_z623_speakers.jpg/320px-Logitech_z623_speakers.jpg" alt="Speakers" style="max-height:260px;max-width:100%;object-fit:contain;border-radius:4px;">
        </div>
        <div style="display:flex;align-items:center;justify-content:center;height:100%;background:#e8edf2;border-radius:6px;">
          <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/8/8e/USB_flash_drive_%28Kingston%29.jpg/320px-USB_flash_drive_%28Kingston%29.jpg" alt="USB Drive" style="max-height:260px;max-width:100%;object-fit:contain;border-radius:4px;">
        </div>
        <div style="display:flex;align-items:center;justify-content:center;height:100%;background:#e8edf2;border-radius:6px;">
          <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/1/12/Spotlight_in_a_theater.jpg/320px-Spotlight_in_a_theater.jpg" alt="Spotlight" style="max-height:260px;max-width:100%;object-fit:contain;border-radius:4px;">
        </div>
        <div style="display:flex;align-items:center;justify-content:center;height:100%;background:#e8edf2;border-radius:6px;">
          <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/5/5f/Screw_Head_-_Temporary_Hearing_Aid.jpg/320px-Screw_Head_-_Temporary_Hearing_Aid.jpg" alt="Screw" style="max-height:260px;max-width:100%;object-fit:contain;border-radius:4px;">
        </div>
      </ui5-carousel>
    </div>
  </div>

  <div class="demo-section">
    <div class="demo-section-header">Content Cards</div>
    <div class="demo-section-body" style="width:100%;">
      <ui5-carousel cyclic style="height:180px; width:100%;">
        <div style="display:flex;align-items:center;justify-content:center;height:100%;">
          <div style="text-align:center;padding:1.5rem 2rem;">
            <ui5-icon name="product" style="font-size:2rem;color:#0064d9;"></ui5-icon>
            <div style="font-size:1rem;font-weight:700;margin-top:0.5rem;">Product Overview</div>
            <div style="font-size:0.875rem;color:#6a7588;margin-top:0.25rem;">Manage your product catalogue and inventory.</div>
          </div>
        </div>
        <div style="display:flex;align-items:center;justify-content:center;height:100%;">
          <div style="text-align:center;padding:1.5rem 2rem;">
            <ui5-icon name="sales-order" style="font-size:2rem;color:#196800;"></ui5-icon>
            <div style="font-size:1rem;font-weight:700;margin-top:0.5rem;">Sales Orders</div>
            <div style="font-size:0.875rem;color:#6a7588;margin-top:0.25rem;">Track and process all incoming orders.</div>
          </div>
        </div>
        <div style="display:flex;align-items:center;justify-content:center;height:100%;">
          <div style="text-align:center;padding:1.5rem 2rem;">
            <ui5-icon name="supplier" style="font-size:2rem;color:#e8743b;"></ui5-icon>
            <div style="font-size:1rem;font-weight:700;margin-top:0.5rem;">Supplier Portal</div>
            <div style="font-size:0.875rem;color:#6a7588;margin-top:0.25rem;">Manage vendor relationships and contracts.</div>
          </div>
        </div>
      </ui5-carousel>
    </div>
  </div>

</body>
</html>
