<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <script src="panel-init.js"></script>
  <script type="module" src="../../../lib/ui5-bundle/ui5-bundle.js"></script>
  <style>
    @font-face { font-family: "72"; font-weight: 400; src: url("https://cdn.jsdelivr.net/npm/@sap-theming/theming-base-content@11.33.0/content/Base/baseLib/baseTheme/fonts/72-Regular.woff2") format("woff2"); }
    @font-face { font-family: "72"; font-weight: 700; src: url("https://cdn.jsdelivr.net/npm/@sap-theming/theming-base-content@11.33.0/content/Base/baseLib/baseTheme/fonts/72-Bold.woff2") format("woff2"); }
    body { font-family: "72", sans-serif; font-size: 0.875rem; background: #f5f6f7; color: #131e29; margin: 0; padding: 2rem; }
    .panel-title { font-size: 1.25rem; font-weight: 700; margin-bottom: 0.25rem; }
    .panel-subtitle { font-size: 0.875rem; color: #6a7588; margin-bottom: 2rem; }
    .demo-section { margin-bottom: 2rem; }
    .demo-section-header { font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: #6a7588; margin-bottom: 1rem; padding-bottom: 0.375rem; border-bottom: 1px solid #e5e5e5; }
    .demo-section-body { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 1rem; }
    .col { display: flex; flex-direction: column; gap: 0.5rem; }
  </style>
</head>
<body>
  <div class="panel-title">CheckBox</div>
  <div class="panel-subtitle">Allows users to select one or more options from a list.</div>

  <div class="demo-section">
    <div class="demo-section-header">States</div>
    <div class="demo-section-body">
      <div class="col">
        <ui5-checkbox text="Unchecked"></ui5-checkbox>
        <ui5-checkbox text="Checked" checked></ui5-checkbox>
        <ui5-checkbox text="Indeterminate" indeterminate></ui5-checkbox>
      </div>
    </div>
  </div>

  <div class="demo-section">
    <div class="demo-section-header">Value State</div>
    <div class="demo-section-body">
      <div class="col">
        <ui5-checkbox text="None (default)" value-state="None"></ui5-checkbox>
        <ui5-checkbox text="Positive" value-state="Positive" checked></ui5-checkbox>
        <ui5-checkbox text="Critical" value-state="Critical" checked></ui5-checkbox>
        <ui5-checkbox text="Negative" value-state="Negative"></ui5-checkbox>
        <ui5-checkbox text="Information" value-state="Information" checked></ui5-checkbox>
      </div>
    </div>
  </div>

  <div class="demo-section">
    <div class="demo-section-header">Disabled &amp; Read-only</div>
    <div class="demo-section-body">
      <div class="col">
        <ui5-checkbox text="Disabled unchecked" disabled></ui5-checkbox>
        <ui5-checkbox text="Disabled checked" disabled checked></ui5-checkbox>
        <ui5-checkbox text="Read-only unchecked" readonly></ui5-checkbox>
        <ui5-checkbox text="Read-only checked" readonly checked></ui5-checkbox>
      </div>
    </div>
  </div>

  <div class="demo-section">
    <div class="demo-section-header">Wrap Text</div>
    <div class="demo-section-body">
      <div style="max-width: 300px; display:flex; flex-direction:column; gap:0.5rem;">
        <ui5-checkbox text="I agree to the Terms and Conditions and the Privacy Policy as stated in the document" wrapping-type="Normal" checked></ui5-checkbox>
        <ui5-checkbox text="Send me product updates and marketing communications" wrapping-type="Normal"></ui5-checkbox>
      </div>
    </div>
  </div>
</body>
</html>
