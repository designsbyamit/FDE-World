<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Action Sheet</title>
  <script src="panel-init.js"></script>
  <script type="module" src="../../../lib/ui5-bundle/ui5-bundle.js"></script>
  <style>
    @font-face { font-family: "72"; font-weight: 400; src: url("https://cdn.jsdelivr.net/npm/@sap-theming/theming-base-content@11.33.0/content/Base/baseLib/baseTheme/fonts/72-Regular.woff2") format("woff2"); }
    @font-face { font-family: "72"; font-weight: 700; src: url("https://cdn.jsdelivr.net/npm/@sap-theming/theming-base-content@11.33.0/content/Base/baseLib/baseTheme/fonts/72-Bold.woff2") format("woff2"); }
    @font-face { font-family: "72"; font-weight: 600; src: url("https://cdn.jsdelivr.net/npm/@sap-theming/theming-base-content@11.33.0/content/Base/baseLib/baseTheme/fonts/72-Semibold.woff2") format("woff2"); }
    @font-face { font-family: "72"; font-weight: 300; src: url("https://cdn.jsdelivr.net/npm/@sap-theming/theming-base-content@11.33.0/content/Base/baseLib/baseTheme/fonts/72-Light.woff2") format("woff2"); }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: "72", sans-serif; font-size: 0.875rem; background: var(--sapBackgroundColor, #f5f6f7); padding: 2rem; color: var(--sapTextColor, #131e29); }
    .panel-title { font-size: 1.5rem; font-weight: 700; color: #131e29; margin-bottom: 0.375rem; }
    .panel-subtitle { font-size: 0.8125rem; color: var(--sapContent_LabelColor, #6a7588); margin-bottom: 2rem; }
    .demo-section { background: #fff; border: 1px solid var(--sapList_BorderColor, #e5e5e5); border-radius: 8px; margin-bottom: 1.25rem; overflow: hidden; }
    .demo-section-header { padding: 0.75rem 1rem; border-bottom: 1px solid var(--sapList_BorderColor, #e5e5e5); font-size: 0.8125rem; font-weight: 600; color: var(--sapContent_LabelColor, #6a7588); display: flex; align-items: center; justify-content: space-between; }
    .demo-section-tag { font-family: monospace; font-size: 0.75rem; color: #0064d9; font-weight: 400; }
    .demo-section-body { padding: 1.25rem 1rem; display: flex; flex-wrap: wrap; gap: 0.75rem; align-items: flex-start; }
    .demo-section-body.column { flex-direction: column; }
    .demo-section-body.block { display: block; padding: 0; }
  </style>
</head>
<body>
  <div class="panel-title">Action Sheet</div>
  <div class="panel-subtitle">Presents a set of actions in a list, anchored to a triggering button. Equivalent to sap.m.ActionSheet.</div>

  <div class="demo-section">
    <div class="demo-section-header">
      Basic Action Sheet
      <span class="demo-section-tag">ui5-menu</span>
    </div>
    <div class="demo-section-body">
      <ui5-button id="as-btn-1" design="Emphasized" icon="action">Open Action Sheet</ui5-button>
      <ui5-menu id="as-menu-1" opener="as-btn-1">
        <ui5-menu-item text="Send Email" icon="email"></ui5-menu-item>
        <ui5-menu-item text="Share" icon="share-2"></ui5-menu-item>
        <ui5-menu-item text="Edit" icon="edit"></ui5-menu-item>
        <ui5-menu-item text="Delete" icon="delete"></ui5-menu-item>
      </ui5-menu>
    </div>
  </div>

  <div class="demo-section">
    <div class="demo-section-header">
      With Cancel Button (Destructive last action)
      <span class="demo-section-tag">ui5-menu</span>
    </div>
    <div class="demo-section-body">
      <ui5-button id="as-btn-2" design="Default">More Options</ui5-button>
      <ui5-menu id="as-menu-2" opener="as-btn-2">
        <ui5-menu-item text="Approve" icon="accept"></ui5-menu-item>
        <ui5-menu-item text="Reject" icon="decline"></ui5-menu-item>
        <ui5-menu-item text="Escalate" icon="warning"></ui5-menu-item>
        <ui5-menu-item text="Delete Record" icon="delete"></ui5-menu-item>
      </ui5-menu>
    </div>
  </div>

  <div class="demo-section">
    <div class="demo-section-header">
      With Submenu
      <span class="demo-section-tag">ui5-menu · ui5-menu-item (children)</span>
    </div>
    <div class="demo-section-body">
      <ui5-button id="as-btn-3" design="Default" icon="slim-arrow-down">Actions</ui5-button>
      <ui5-menu id="as-menu-3" opener="as-btn-3">
        <ui5-menu-item text="Export" icon="download">
          <ui5-menu-item text="Export as PDF" icon="pdf-attachment"></ui5-menu-item>
          <ui5-menu-item text="Export as Excel" icon="excel-attachment"></ui5-menu-item>
          <ui5-menu-item text="Export as CSV" icon="document-text"></ui5-menu-item>
        </ui5-menu-item>
        <ui5-menu-item text="Print" icon="print"></ui5-menu-item>
        <ui5-menu-item text="Archive" icon="filing-cabinet"></ui5-menu-item>
      </ui5-menu>
    </div>
  </div>

  <script>
    ['1','2','3'].forEach(function(n) {
      var btn = document.getElementById('as-btn-' + n);
      var menu = document.getElementById('as-menu-' + n);
      if (btn && menu) btn.addEventListener('click', function() { menu.open = true; });
    });
  </script>
</body>
</html>
