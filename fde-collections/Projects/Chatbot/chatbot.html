<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Joule — AI Assistant</title>
  <style>
    /* SAP 72 font (Joule uses the same SAP font family) */
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');

    /* ── Joule design tokens ── */
    :root {
      --joule-purple-dark:   #3D0D6B;
      --joule-purple:        #6B27C4;
      --joule-purple-mid:    #8B44D6;
      --joule-purple-light:  #B07AE8;
      --joule-purple-pale:   #F3EDFB;
      --joule-purple-xpale:  #FAF6FE;
      --joule-accent:        #C85EFC;
      --joule-bg:            #FFFFFF;
      --joule-surface:       #F7F4FB;
      --joule-border:        #E8DEFC;
      --joule-text:          #1A0533;
      --joule-text-muted:    #7B6A92;
      --joule-text-light:    #B0A0C2;
      --joule-green:         #1DB966;
      --joule-amber:         #E8A000;
      --joule-amber-bg:      #FFF8E6;
      --joule-amber-border:  #F5D87A;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #EDE8F8 0%, #F5F0FD 50%, #EAF0FD 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
    }

    /* ── Launcher button ── */
    .launcher {
      position: fixed;
      bottom: 28px;
      right: 28px;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: linear-gradient(145deg, var(--joule-purple-mid), var(--joule-purple-dark));
      border: none;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(107,39,196,0.45), 0 0 0 0 rgba(107,39,196,0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s, box-shadow 0.2s;
      z-index: 1000;
    }
    .launcher:hover {
      transform: scale(1.08);
      box-shadow: 0 6px 28px rgba(107,39,196,0.6), 0 0 0 6px rgba(107,39,196,0.08);
    }
    .launcher svg { width: 26px; height: 26px; fill: #fff; transition: opacity 0.2s; }
    .launcher .icon-close { display: none; }
    .launcher.open .icon-chat { display: none; }
    .launcher.open .icon-close { display: block; }

    .launcher-badge {
      position: absolute;
      top: -2px; right: -2px;
      width: 18px; height: 18px;
      background: #e74c3c;
      border-radius: 50%;
      font-size: 10px;
      font-weight: 700;
      color: #fff;
      display: flex; align-items: center; justify-content: center;
      border: 2px solid #EDE8F8;
      transition: opacity 0.2s;
    }
    .launcher-badge.hidden { opacity: 0; }

    /* ── Chat window ── */
    .chat-window {
      position: fixed;
      bottom: 96px;
      right: 28px;
      width: 388px;
      height: 616px;
      background: var(--joule-bg);
      border-radius: 20px;
      box-shadow: 0 16px 56px rgba(61,13,107,0.18), 0 2px 8px rgba(61,13,107,0.08);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      z-index: 999;
      transform: scale(0.92) translateY(16px);
      opacity: 0;
      pointer-events: none;
      transform-origin: bottom right;
      transition: transform 0.28s cubic-bezier(0.34,1.56,0.64,1), opacity 0.2s ease;
      border: 1px solid var(--joule-border);
    }
    .chat-window.open {
      transform: scale(1) translateY(0);
      opacity: 1;
      pointer-events: all;
    }

    /* ── Header ── */
    .chat-header {
      background: linear-gradient(135deg, var(--joule-purple-dark) 0%, var(--joule-purple) 55%, var(--joule-purple-mid) 100%);
      padding: 1rem 1.25rem 0.875rem;
      color: #fff;
      flex-shrink: 0;
      position: relative;
      overflow: hidden;
    }
    /* Subtle orb decoration in header */
    .chat-header::before {
      content: '';
      position: absolute;
      top: -30px; right: -20px;
      width: 110px; height: 110px;
      border-radius: 50%;
      background: rgba(200,94,252,0.18);
      pointer-events: none;
    }
    .chat-header::after {
      content: '';
      position: absolute;
      bottom: -20px; left: 10px;
      width: 70px; height: 70px;
      border-radius: 50%;
      background: rgba(255,255,255,0.07);
      pointer-events: none;
    }
    .chat-header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 0.625rem;
      position: relative;
      z-index: 1;
    }
    .chat-header-identity {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    /* Joule avatar: white circle with sparkle icon */
    .bot-avatar {
      width: 38px; height: 38px;
      border-radius: 50%;
      background: rgba(255,255,255,0.22);
      border: 1.5px solid rgba(255,255,255,0.35);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .bot-avatar svg { width: 20px; height: 20px; fill: #fff; }
    .bot-name { font-weight: 600; font-size: 0.9375rem; letter-spacing: 0.01em; }
    .bot-status {
      font-size: 0.7rem;
      opacity: 0.82;
      display: flex;
      align-items: center;
      gap: 0.3rem;
      margin-top: 1px;
    }
    .status-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--joule-green);
      display: inline-block;
    }
    .header-actions { display: flex; gap: 0.25rem; position: relative; z-index: 1; }
    .header-btn {
      width: 30px; height: 30px;
      border-radius: 50%;
      border: none;
      background: rgba(255,255,255,0.12);
      color: #fff;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.15s;
    }
    .header-btn:hover { background: rgba(255,255,255,0.24); }
    .header-btn svg { width: 14px; height: 14px; fill: #fff; }

    .chat-header-subtitle {
      font-size: 0.72rem;
      opacity: 0.75;
      line-height: 1.4;
      position: relative;
      z-index: 1;
    }

    /* ── Messages area ── */
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 1.125rem 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      scroll-behavior: smooth;
      background: var(--joule-bg);
    }
    .messages::-webkit-scrollbar { width: 3px; }
    .messages::-webkit-scrollbar-track { background: transparent; }
    .messages::-webkit-scrollbar-thumb { background: var(--joule-border); border-radius: 4px; }

    /* System message */
    .msg-system {
      text-align: center;
      font-size: 0.68rem;
      color: var(--joule-text-light);
      padding: 0.25rem 0;
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }
    .msg-system span {
      background: var(--joule-surface);
      padding: 3px 10px;
      border-radius: 10px;
      border: 1px solid var(--joule-border);
    }

    /* Message row */
    .msg-row {
      display: flex;
      align-items: flex-end;
      gap: 0.5rem;
      animation: msgIn 0.22s ease;
    }
    @keyframes msgIn {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .msg-row.user { flex-direction: row-reverse; }

    .msg-avatar {
      width: 28px; height: 28px;
      border-radius: 50%;
      font-size: 11px;
      font-weight: 700;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      margin-bottom: 2px;
    }
    .msg-avatar.bot {
      background: linear-gradient(135deg, var(--joule-purple-pale), var(--joule-border));
      border: 1px solid var(--joule-border);
    }
    .msg-avatar.bot svg { width: 14px; height: 14px; fill: var(--joule-purple); }
    .msg-avatar.agent { background: var(--joule-amber-bg); color: #7A5000; border: 1px solid var(--joule-amber-border); font-size: 10px; }
    .msg-avatar.user { background: linear-gradient(135deg, var(--joule-purple-mid), var(--joule-purple-dark)); color: #fff; font-size: 10px; }

    .msg-body { max-width: 78%; display: flex; flex-direction: column; gap: 2px; }
    .msg-row.user .msg-body { align-items: flex-end; }

    .msg-sender {
      font-size: 0.68rem;
      color: var(--joule-text-muted);
      margin-bottom: 2px;
      padding: 0 4px;
      font-weight: 500;
    }

    .bubble {
      padding: 0.625rem 0.9rem;
      border-radius: 16px;
      font-size: 0.875rem;
      line-height: 1.55;
      color: var(--joule-text);
      background: var(--joule-surface);
      border: 1px solid var(--joule-border);
      border-bottom-left-radius: 4px;
      position: relative;
    }
    .msg-row.user .bubble {
      background: linear-gradient(135deg, var(--joule-purple-mid), var(--joule-purple-dark));
      color: #fff;
      border: none;
      border-bottom-right-radius: 4px;
      border-bottom-left-radius: 16px;
    }
    .msg-row.agent .bubble {
      background: var(--joule-amber-bg);
      border: 1px solid var(--joule-amber-border);
      border-bottom-left-radius: 4px;
      color: #3D2000;
    }

    .bubble p + p { margin-top: 0.4rem; }
    .bubble ul { padding-left: 1.1rem; margin-top: 0.3rem; }
    .bubble li { margin-bottom: 0.2rem; }

    /* Message actions (copy, feedback) */
    .msg-actions {
      display: flex;
      gap: 0.25rem;
      opacity: 0;
      transition: opacity 0.15s;
      padding: 0 4px;
      margin-top: 2px;
    }
    .msg-row:hover .msg-actions { opacity: 1; }
    .msg-row.user .msg-actions { flex-direction: row-reverse; }
    .msg-action-btn {
      width: 24px; height: 24px;
      border: none; background: none;
      cursor: pointer;
      border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      color: var(--joule-text-light);
      transition: color 0.15s, background 0.15s;
    }
    .msg-action-btn:hover { color: var(--joule-purple); background: var(--joule-purple-pale); }
    .msg-action-btn.active { color: var(--joule-purple); }
    .msg-action-btn svg { width: 13px; height: 13px; }

    .msg-time {
      font-size: 0.63rem;
      color: var(--joule-text-light);
      padding: 0 4px;
    }

    /* Typing indicator */
    .typing-row { display: flex; align-items: flex-end; gap: 0.5rem; }
    .typing-bubble {
      background: var(--joule-surface);
      border: 1px solid var(--joule-border);
      border-radius: 16px;
      border-bottom-left-radius: 4px;
      padding: 0.75rem 1rem;
      display: flex; gap: 4px; align-items: center;
    }
    .typing-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--joule-purple-light);
      animation: typingBounce 1.2s infinite ease-in-out;
    }
    .typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes typingBounce {
      0%, 60%, 100% { transform: translateY(0); }
      30% { transform: translateY(-5px); }
    }

    /* Quick replies */
    .quick-replies {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      padding: 0 1rem 0.75rem;
    }
    .quick-reply {
      padding: 0.35rem 0.825rem;
      border: 1.5px solid var(--joule-border);
      border-radius: 20px;
      background: var(--joule-bg);
      color: var(--joule-purple);
      font-size: 0.8rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
      white-space: nowrap;
    }
    .quick-reply:hover {
      background: var(--joule-purple-pale);
      border-color: var(--joule-purple-light);
      color: var(--joule-purple-dark);
    }

    /* Handover card */
    .handover-card {
      margin: 0.25rem 1rem;
      background: linear-gradient(135deg, var(--joule-amber-bg), #FFF3D0);
      border: 1px solid var(--joule-amber-border);
      border-radius: 14px;
      padding: 1rem;
      animation: msgIn 0.3s ease;
    }
    .handover-card-title {
      font-size: 0.875rem;
      font-weight: 600;
      color: #7A4500;
      margin-bottom: 0.35rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }
    .handover-card-body {
      font-size: 0.8125rem;
      color: #5A3500;
      line-height: 1.5;
      margin-bottom: 0.75rem;
    }
    .handover-card-actions { display: flex; gap: 0.5rem; }
    .btn-handover-confirm {
      flex: 1;
      padding: 0.5rem;
      background: linear-gradient(135deg, var(--joule-purple-mid), var(--joule-purple-dark));
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 0.8125rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    .btn-handover-confirm:hover { opacity: 0.88; }
    .btn-handover-cancel {
      padding: 0.5rem 0.875rem;
      background: transparent;
      color: #7A4500;
      border: 1px solid var(--joule-amber-border);
      border-radius: 8px;
      font-size: 0.8125rem;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn-handover-cancel:hover { background: var(--joule-amber-bg); }

    /* Agent connecting state */
    .connecting-card {
      margin: 0.25rem 1rem;
      background: var(--joule-purple-xpale);
      border: 1px solid var(--joule-border);
      border-radius: 14px;
      padding: 1.25rem 1rem;
      text-align: center;
      animation: msgIn 0.3s ease;
    }
    .connecting-spinner {
      width: 32px; height: 32px;
      border: 3px solid var(--joule-border);
      border-top-color: var(--joule-purple);
      border-radius: 50%;
      margin: 0 auto 0.75rem;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .connecting-title {
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--joule-purple-dark);
      margin-bottom: 0.25rem;
    }
    .connecting-sub {
      font-size: 0.75rem;
      color: var(--joule-text-muted);
    }

    /* Agent connected banner */
    .agent-banner {
      background: var(--joule-amber-bg);
      border-top: 1px solid var(--joule-amber-border);
      border-bottom: 1px solid var(--joule-amber-border);
      padding: 0.45rem 1rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.73rem;
      color: #7A4500;
      flex-shrink: 0;
    }
    .agent-banner-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--joule-amber); flex-shrink: 0; }
    .agent-banner strong { font-weight: 600; }
    .agent-banner.hidden { display: none; }

    /* Input area */
    .input-area {
      padding: 0.75rem 1rem;
      border-top: 1px solid var(--joule-border);
      background: var(--joule-bg);
      flex-shrink: 0;
    }
    .input-row {
      display: flex;
      align-items: flex-end;
      gap: 0.5rem;
      background: var(--joule-surface);
      border: 1.5px solid var(--joule-border);
      border-radius: 14px;
      padding: 0.5rem 0.5rem 0.5rem 0.875rem;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .input-row:focus-within {
      border-color: var(--joule-purple-light);
      box-shadow: 0 0 0 3px rgba(107,39,196,0.08);
    }
    .chat-input {
      flex: 1;
      border: none;
      background: transparent;
      font-size: 0.875rem;
      font-family: inherit;
      resize: none;
      outline: none;
      max-height: 100px;
      line-height: 1.5;
      color: var(--joule-text);
    }
    .chat-input::placeholder { color: var(--joule-text-light); }
    .input-actions { display: flex; gap: 0.25rem; align-items: flex-end; }
    .input-btn {
      width: 30px; height: 30px;
      border: none; background: none;
      cursor: pointer;
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      color: var(--joule-text-light);
      transition: color 0.15s, background 0.15s;
    }
    .input-btn:hover { color: var(--joule-purple); background: var(--joule-purple-pale); }
    .input-btn svg { width: 16px; height: 16px; fill: currentColor; }
    .send-btn {
      width: 32px; height: 32px;
      border-radius: 9px;
      background: linear-gradient(135deg, var(--joule-purple-mid), var(--joule-purple-dark));
      border: none;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: opacity 0.15s, transform 0.1s;
      flex-shrink: 0;
    }
    .send-btn:hover { opacity: 0.88; }
    .send-btn:active { transform: scale(0.93); }
    .send-btn svg { width: 15px; height: 15px; fill: #fff; }
    .send-btn:disabled { background: var(--joule-border); cursor: default; opacity: 1; }
    .send-btn:disabled svg { fill: var(--joule-text-light); }

    .input-footer {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.3rem;
      margin-top: 0.5rem;
      font-size: 0.63rem;
      color: var(--joule-text-light);
    }
    .input-footer svg { width: 10px; height: 10px; fill: var(--joule-purple-light); }

    /* Demo page context */
    .demo-label {
      position: fixed;
      top: 2rem;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.875rem;
      color: var(--joule-purple-light);
      letter-spacing: 0.05em;
      opacity: 0.7;
    }
  </style>
</head>
<body>

<div class="demo-label">← Your website content goes here →</div>

<!-- Launcher -->
<button class="launcher open" id="launcher" onclick="toggleChat()">
  <!-- Joule sparkle/star icon -->
  <svg class="icon-chat" viewBox="0 0 24 24"><path d="M12 2l2.09 6.26L20 10l-5.91 1.74L12 18l-2.09-6.26L4 10l5.91-1.74L12 2z" fill="#fff"/><circle cx="19" cy="5" r="1.5" fill="rgba(255,255,255,0.7)"/><circle cx="5" cy="18" r="1" fill="rgba(255,255,255,0.5)"/></svg>
  <svg class="icon-close" viewBox="0 0 24 24"><path d="M18.3 5.71a1 1 0 00-1.41 0L12 10.59 7.11 5.7A1 1 0 005.7 7.11L10.59 12 5.7 16.89a1 1 0 001.41 1.41L12 13.41l4.89 4.89a1 1 0 001.41-1.41L13.41 12l4.89-4.89a1 1 0 000-1.4z"/></svg>
  <span class="launcher-badge hidden" id="badge">1</span>
</button>

<!-- Chat window -->
<div class="chat-window open" id="chatWindow">

  <!-- Header -->
  <div class="chat-header">
    <div class="chat-header-top">
      <div class="chat-header-identity">
        <div class="bot-avatar">
            <svg viewBox="0 0 24 24"><path d="M12 2l2.09 6.26L20 10l-5.91 1.74L12 18l-2.09-6.26L4 10l5.91-1.74L12 2z"/><circle cx="19" cy="5" r="1.5" fill="rgba(255,255,255,0.6)"/><circle cx="5" cy="18" r="1" fill="rgba(255,255,255,0.4)"/></svg>
          </div>
          <div>
            <div class="bot-name">Joule</div>
            <div class="bot-status"><span class="status-dot"></span> Online · AI Assistant</div>
        </div>
      </div>
      <div class="header-actions">
        <button class="header-btn" title="Search" onclick="alert('Search coming soon')">
          <svg viewBox="0 0 24 24"><path d="M21 21l-4.35-4.35M17 11A6 6 0 115 11a6 6 0 0112 0z" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
        </button>
        <button class="header-btn" title="Minimize" onclick="toggleChat()">
          <svg viewBox="0 0 24 24"><path d="M5 12h14" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
        </button>
      </div>
    </div>
    <div class="chat-header-subtitle">Powered by SAP AI Core · Available 24/7</div>
  </div>

  <!-- Agent connected banner (hidden by default) -->
  <div class="agent-banner hidden" id="agentBanner">
    <span class="agent-banner-dot"></span>
    <span>You're chatting with <strong>Sarah</strong> · Live Agent</span>
  </div>

  <!-- Messages -->
  <div class="messages" id="messages">
    <div class="msg-system"><span>Today</span></div>
  </div>

  <!-- Quick replies -->
  <div class="quick-replies" id="quickReplies">
      <button class="quick-reply" onclick="sendQuick(this)">👋 Get started</button>
    <button class="quick-reply" onclick="sendQuick(this)">💰 Pricing</button>
    <button class="quick-reply" onclick="sendQuick(this)">🔧 Technical support</button>
    <button class="quick-reply" onclick="sendQuick(this)">🧑‍💼 Talk to a human</button>
  </div>

  <!-- Input -->
  <div class="input-area">
    <div class="input-row">
      <textarea class="chat-input" id="chatInput" placeholder="Ask Joule..." rows="1"
        onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
      <div class="input-actions">
        <button class="input-btn" title="Attach file" onclick="alert('File attachment coming soon')">
          <svg viewBox="0 0 24 24"><path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button class="send-btn" id="sendBtn" onclick="sendMessage()" disabled>
          <svg viewBox="0 0 24 24"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
        </button>
      </div>
    </div>
    <div class="input-footer">
        <svg viewBox="0 0 24 24"><path d="M12 2l2.09 6.26L20 10l-5.91 1.74L12 18l-2.09-6.26L4 10l5.91-1.74L12 2z"/></svg>
        Powered by SAP Joule · End-to-end encrypted
      </div>
  </div>

</div>

<script>
  // ── State ──
  let isOpen = true;
  let isAgentMode = false;
  let awaitingHandover = false;
  let messageCount = 0;

  // ── AI responses (mock) ──
  const aiResponses = {
    "get started": {
      text: "Great! I'm Joule, your SAP AI assistant. ✨\n\nI can help you with:\n• **Product information** and pricing\n• **Technical support** and troubleshooting\n• **Account** questions\n• Or connect you with a **live agent** anytime\n\nWhat can I help you with today?",
      quick: ["Tell me about pricing", "I need technical help", "Account question"]
    },
    "pricing": {
      text: "We offer three plans:\n\n**Starter** — Free\nUp to 3 projects, 1 user\n\n**Pro** — $29/mo\nUnlimited projects, 5 users, priority support\n\n**Enterprise** — Custom\nUnlimited everything, dedicated support, SLA\n\nWould you like more details on any plan?",
      quick: ["Tell me about Pro", "Tell me about Enterprise", "Start free trial"]
    },
    "technical support": {
      text: "I can help with technical issues! Here are the most common topics:\n\n🔧 **Setup & Installation**\n🔗 **API Integration**\n🐛 **Bug reports**\n⚡ **Performance issues**\n\nWhat are you running into?",
      quick: ["Setup help", "API docs", "Report a bug"]
    },
    "talk to a human": "HANDOVER",
    "human": "HANDOVER",
    "agent": "HANDOVER",
    "live agent": "HANDOVER",
    "real person": "HANDOVER",
    "default": [
      "That's a great question! Let me help you with that. Could you share a bit more context so I can give you the most accurate answer?",
      "Thanks for reaching out! I understand what you're asking. Based on what you've described, here's what I'd recommend...\n\nWould you like me to go into more detail on any specific part?",
      "I'm on it! Here's what I know about that topic:\n\nThis is a common question and the answer depends on your specific situation. Generally speaking, the best approach is to start with the basics and build from there.\n\nDoes that help, or would you like me to dig deeper?",
      "Great question! I've looked into this for you.\n\nThe short answer is: it depends on a few factors. Let me walk you through the key considerations so you can make the best decision for your needs.",
      "Absolutely, I can help with that! This is something our team has worked hard to make as seamless as possible.\n\nHere's a quick overview of how it works, and feel free to ask follow-up questions!"
    ]
  };

  // ── Bot avatar SVG (Joule sparkle) ──
  const JOULE_AVATAR = `<svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor" style="color:var(--joule-purple)"><path d="M12 2l2.09 6.26L20 10l-5.91 1.74L12 18l-2.09-6.26L4 10l5.91-1.74L12 2z"/></svg>`;

  // ── Boot: show welcome message ──
  window.addEventListener('load', () => {
    setTimeout(() => addBotMessage("Hi there! ✨ I'm **Joule**, your SAP AI assistant. How can I help you today?"), 600);
  });

  // ── Toggle chat window ──
  function toggleChat() {
    isOpen = !isOpen;
    const win = document.getElementById('chatWindow');
    const btn = document.getElementById('launcher');
    const badge = document.getElementById('badge');
    win.classList.toggle('open', isOpen);
    btn.classList.toggle('open', isOpen);
    badge.classList.add('hidden');
    if (isOpen) setTimeout(() => document.getElementById('chatInput').focus(), 300);
  }

  // ── Send message ──
  function sendMessage() {
    const input = document.getElementById('chatInput');
    const text = input.value.trim();
    if (!text) return;
    input.value = '';
    input.style.height = 'auto';
    document.getElementById('sendBtn').disabled = true;
    document.getElementById('quickReplies').innerHTML = '';
    addUserMessage(text);
    if (isAgentMode) {
      setTimeout(() => addAgentMessage(getAgentResponse(text)), 1200 + Math.random() * 800);
    } else {
      respondToUser(text);
    }
  }

  function sendQuick(btn) {
    const text = btn.textContent.replace(/^[^\w]*/, '').trim();
    document.getElementById('quickReplies').innerHTML = '';
    addUserMessage(btn.textContent.trim());
    respondToUser(text);
  }

  function respondToUser(text) {
    const lower = text.toLowerCase();
    // Check for handover intent
    if (lower.includes('human') || lower.includes('agent') || lower.includes('person') || lower.includes('talk to')) {
      setTimeout(() => showHandoverCard(), 800);
      return;
    }
    showTyping();
    const delay = 900 + Math.random() * 700;
    setTimeout(() => {
      removeTyping();
      let response = null;
      for (const [key, val] of Object.entries(aiResponses)) {
        if (key !== 'default' && lower.includes(key)) { response = val; break; }
      }
      if (!response) {
        const defaults = aiResponses.default;
        response = defaults[Math.floor(Math.random() * defaults.length)];
      }
      if (response === "HANDOVER") { showHandoverCard(); return; }
      if (typeof response === 'object' && response.text) {
        addBotMessage(response.text);
        if (response.quick) showQuickReplies(response.quick);
      } else {
        addBotMessage(response);
      }
    }, delay);
  }

  // ── Add messages to DOM ──
  function addUserMessage(text) {
    const msgs = document.getElementById('messages');
    const row = document.createElement('div');
    row.className = 'msg-row user';
    row.innerHTML = `
      <div class="msg-avatar user">You</div>
      <div class="msg-body">
        <div class="bubble">${escapeHtml(text)}</div>
        <div class="msg-actions">
          <button class="msg-action-btn" title="Copy" onclick="copyMsg(this, '${escapeAttr(text)}')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>
          </button>
        </div>
        <div class="msg-time">${getTime()}</div>
      </div>`;
    msgs.appendChild(row);
    scrollToBottom();
  }

  function addBotMessage(text) {
    const msgs = document.getElementById('messages');
    const row = document.createElement('div');
    row.className = 'msg-row bot';
    const html = renderMarkdown(text);
    const id = 'msg-' + (++messageCount);
    row.innerHTML = `
      <div class="msg-avatar bot">${JOULE_AVATAR}</div>
      <div class="msg-body">
        <div class="bubble" id="${id}">${html}</div>
        <div class="msg-actions">
          <button class="msg-action-btn" title="Copy" onclick="copyMsg(this, ${JSON.stringify(text)})">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>
          </button>
          <button class="msg-action-btn" title="Helpful" onclick="feedback(this, 'up')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 9V5a3 3 0 00-3-3l-4 9v11h11.28a2 2 0 002-1.7l1.38-9a2 2 0 00-2-2.3H14zM7 22H4a2 2 0 01-2-2v-7a2 2 0 012-2h3"/></svg>
          </button>
          <button class="msg-action-btn" title="Not helpful" onclick="feedback(this, 'down')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 15v4a3 3 0 003 3l4-9V2H5.72a2 2 0 00-2 1.7l-1.38 9a2 2 0 002 2.3H10zM17 2h2.67A2.31 2.31 0 0122 4v7a2.31 2.31 0 01-2.33 2H17"/></svg>
          </button>
        </div>
        <div class="msg-time">${getTime()}</div>
      </div>`;
    msgs.appendChild(row);
    scrollToBottom();
  }

  function addAgentMessage(text) {
    const msgs = document.getElementById('messages');
    const row = document.createElement('div');
    row.className = 'msg-row agent';
    row.innerHTML = `
      <div class="msg-avatar agent">SA</div>
      <div class="msg-body">
        <div class="msg-sender">Sarah · Live Agent</div>
        <div class="bubble">${escapeHtml(text)}</div>
        <div class="msg-time">${getTime()}</div>
      </div>`;
    msgs.appendChild(row);
    scrollToBottom();
  }

  function addSystemMessage(text) {
    const msgs = document.getElementById('messages');
    const div = document.createElement('div');
    div.className = 'msg-system';
    div.innerHTML = `<span>${text}</span>`;
    msgs.appendChild(div);
    scrollToBottom();
  }

  // ── Typing indicator ──
  function showTyping() {
    const msgs = document.getElementById('messages');
    const row = document.createElement('div');
    row.className = 'typing-row'; row.id = 'typing';
    row.innerHTML = `<div class="msg-avatar bot">${JOULE_AVATAR}</div><div class="typing-bubble"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div>`;
    msgs.appendChild(row);
    scrollToBottom();
  }
  function removeTyping() {
    const t = document.getElementById('typing');
    if (t) t.remove();
  }

  // ── Quick replies ──
  function showQuickReplies(replies) {
    const qr = document.getElementById('quickReplies');
    qr.innerHTML = replies.map(r => `<button class="quick-reply" onclick="sendQuick(this)">${r}</button>`).join('');
  }

  // ── Handover flow ──
  function showHandoverCard() {
    removeTyping();
    const msgs = document.getElementById('messages');
    const card = document.createElement('div');
    card.className = 'handover-card'; card.id = 'handoverCard';
    card.innerHTML = `
      <div class="handover-card-title">🧑‍💼 Connect with a live agent</div>
      <div class="handover-card-body">I'll hand you over to a real person from our support team. They'll have the full context of our conversation with Joule.<br><br>Average wait time: <strong>~2 minutes</strong></div>
      <div class="handover-card-actions">
        <button class="btn-handover-confirm" onclick="confirmHandover()">Connect me now</button>
        <button class="btn-handover-cancel" onclick="cancelHandover()">Stay with AI</button>
      </div>`;
    msgs.appendChild(card);
    scrollToBottom();
  }

  function confirmHandover() {
    document.getElementById('handoverCard')?.remove();
    const msgs = document.getElementById('messages');
    // Connecting state
    const card = document.createElement('div');
    card.className = 'connecting-card';
    card.innerHTML = `<div class="connecting-spinner"></div><div class="connecting-title">Connecting you to an agent…</div><div class="connecting-sub">Please wait, this usually takes a moment</div>`;
    msgs.appendChild(card);
    scrollToBottom();
    // Simulate agent joining
    setTimeout(() => {
      card.remove();
      isAgentMode = true;
      document.getElementById('agentBanner').classList.remove('hidden');
      document.querySelector('.bot-avatar').innerHTML = '<svg viewBox="0 0 24 24" width="20" height="20" fill="#fff"><path d="M12 3l1.5 4.5L18 9l-4.5 1.5L12 15l-1.5-4.5L6 9l4.5-1.5L12 3z"/><circle cx="18" cy="5" r="1.2" fill="rgba(255,255,255,0.6)"/></svg>';
      document.querySelector('.bot-name').textContent = 'Sarah';
      document.querySelector('.bot-status').innerHTML = '<span class="status-dot" style="background:var(--joule-amber)"></span> Live Agent · Human Support';
      addSystemMessage('Sarah has joined the conversation');
      setTimeout(() => addAgentMessage("Hi! I'm Sarah from the support team. I can see your conversation with Joule. How can I help you today?"), 500);
    }, 2800);
  }

  function cancelHandover() {
    document.getElementById('handoverCard')?.remove();
    addBotMessage("No problem! I'm still here to help. What else can I assist you with?");
    showQuickReplies(["💰 Pricing", "🔧 Technical support", "📋 Account question"]);
  }

  // ── Agent responses (mock) ──
  function getAgentResponse(text) {
    const responses = [
      "Thanks for that detail! Let me pull up your account and take a look. One moment please.",
      "I can see the issue you're describing. I've escalated this internally and will have a resolution for you shortly.",
      "Great question! I'm checking our internal systems right now. Can you confirm your email address so I can look up your account?",
      "I completely understand your frustration, and I apologize for the inconvenience. Let me make this right for you.",
      "I've reviewed the details and I have a solution for you. Here's what we're going to do to resolve this quickly."
    ];
    return responses[Math.floor(Math.random() * responses.length)];
  }

  // ── Helpers ──
  function handleKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
    document.getElementById('sendBtn').disabled = e.target.value.trim().length === 0 && e.key !== 'Enter';
  }

  document.getElementById('chatInput').addEventListener('input', function() {
    document.getElementById('sendBtn').disabled = this.value.trim().length === 0;
  });

  function autoResize(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 100) + 'px';
  }

  function scrollToBottom() {
    const m = document.getElementById('messages');
    requestAnimationFrame(() => m.scrollTop = m.scrollHeight);
  }

  function getTime() {
    return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  }

  function renderMarkdown(text) {
    return escapeHtml(text)
      .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
      .replace(/\n\n/g, '</p><p>')
      .replace(/\n• /g, '</p><ul><li>').replace(/\n/g, '<br>')
      .replace(/• /g, '<li>')
      .replace(/^/, '<p>').replace(/$/, '</p>');
  }

  function escapeHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  function escapeAttr(s) {
    return s.replace(/'/g, "\\'").replace(/"/g, '&quot;');
  }

  function copyMsg(btn, text) {
    navigator.clipboard.writeText(text).then(() => {
      btn.classList.add('active');
      setTimeout(() => btn.classList.remove('active'), 1500);
    });
  }

  function feedback(btn, type) {
    btn.classList.add('active');
    const sibling = btn.parentElement.querySelector(`.msg-action-btn[title="${type === 'up' ? 'Not helpful' : 'Helpful'}"]`);
    if (sibling) sibling.style.opacity = '0.3';
  }
</script>
</body>
</html>
