<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <script src="panel-init.js"></script>
  <script type="module" src="../../../lib/ui5-bundle/ui5-bundle.js"></script>
  <style>
    @font-face { font-family: "72"; font-weight: 400; src: url("https://cdn.jsdelivr.net/npm/@sap-theming/theming-base-content@11.33.0/content/Base/baseLib/baseTheme/fonts/72-Regular.woff2") format("woff2"); }
    @font-face { font-family: "72"; font-weight: 700; src: url("https://cdn.jsdelivr.net/npm/@sap-theming/theming-base-content@11.33.0/content/Base/baseLib/baseTheme/fonts/72-Bold.woff2") format("woff2"); }
    body { font-family: "72", sans-serif; font-size: 0.875rem; background: #f5f6f7; color: #131e29; margin: 0; padding: 2rem; }
    .panel-title { font-size: 1.25rem; font-weight: 700; margin-bottom: 0.25rem; }
    .panel-subtitle { font-size: 0.875rem; color: #6a7588; margin-bottom: 2rem; }
    .demo-section { margin-bottom: 2rem; }
    .demo-section-header { font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: #6a7588; margin-bottom: 1rem; padding-bottom: 0.375rem; border-bottom: 1px solid #e5e5e5; }
    .demo-section-body { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 1rem; }
    ui5-input { width: 240px; }
  </style>
</head>
<body>
  <div class="panel-title">Input</div>
  <div class="panel-subtitle">A single-line text field for capturing user input.</div>

  <div class="demo-section">
    <div class="demo-section-header">Types</div>
    <div class="demo-section-body">
      <ui5-input type="Text" placeholder="Text input" value="John Doe"></ui5-input>
      <ui5-input type="Number" placeholder="Number input" value="1000"></ui5-input>
      <ui5-input type="Email" placeholder="Email address" value="john.doe@example.com"></ui5-input>
      <ui5-input type="Password" placeholder="Password" value="secret123"></ui5-input>
      <ui5-input type="Tel" placeholder="Phone number" value="+49 30 1234567"></ui5-input>
    </div>
  </div>

  <div class="demo-section">
    <div class="demo-section-header">Value States</div>
    <div class="demo-section-body">
      <ui5-input value-state="None" value="Default" placeholder="None"></ui5-input>
      <ui5-input value-state="Positive" value="Validated" placeholder="Positive"></ui5-input>
      <ui5-input value-state="Critical" value="Review needed" placeholder="Critical">
        <div slot="valueStateMessage">This field requires your attention.</div>
      </ui5-input>
      <ui5-input value-state="Negative" value="Invalid entry" placeholder="Negative">
        <div slot="valueStateMessage">Please enter a valid value.</div>
      </ui5-input>
      <ui5-input value-state="Information" value="FYI" placeholder="Information">
        <div slot="valueStateMessage">This value is informational only.</div>
      </ui5-input>
    </div>
  </div>

  <div class="demo-section">
    <div class="demo-section-header">With Icon</div>
    <div class="demo-section-body">
      <ui5-input placeholder="Search orders…" show-clear-icon>
        <ui5-icon slot="icon" name="search"></ui5-icon>
      </ui5-input>
      <ui5-input placeholder="Enter amount" value="4,500.00">
        <ui5-icon slot="icon" name="money-bills"></ui5-icon>
      </ui5-input>
      <ui5-input placeholder="Enter employee ID" value="I753220">
        <ui5-icon slot="icon" name="employee"></ui5-icon>
      </ui5-input>
    </div>
  </div>

  <div class="demo-section">
    <div class="demo-section-header">Disabled &amp; Read-only</div>
    <div class="demo-section-body">
      <ui5-input disabled value="Disabled field"></ui5-input>
      <ui5-input readonly value="Read-only value"></ui5-input>
    </div>
  </div>
</body>
</html>
