<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <script src="panel-init.js"></script>
  <script type="module" src="../../../lib/ui5-bundle/ui5-bundle.js"></script>
  <style>
    @font-face { font-family: "72"; font-weight: 400; src: url("https://cdn.jsdelivr.net/npm/@sap-theming/theming-base-content@11.33.0/content/Base/baseLib/baseTheme/fonts/72-Regular.woff2") format("woff2"); }
    @font-face { font-family: "72"; font-weight: 700; src: url("https://cdn.jsdelivr.net/npm/@sap-theming/theming-base-content@11.33.0/content/Base/baseLib/baseTheme/fonts/72-Bold.woff2") format("woff2"); }
    @font-face { font-family: "72"; font-weight: 600; src: url("https://cdn.jsdelivr.net/npm/@sap-theming/theming-base-content@11.33.0/content/Base/baseLib/baseTheme/fonts/72-Semibold.woff2") format("woff2"); }
    @font-face { font-family: "72"; font-weight: 300; src: url("https://cdn.jsdelivr.net/npm/@sap-theming/theming-base-content@11.33.0/content/Base/baseLib/baseTheme/fonts/72-Light.woff2") format("woff2"); }
    body { font-family: "72", sans-serif; font-size: 0.875rem; background: #f5f6f7; color: #131e29; margin: 0; padding: 2rem; }
    .panel-title { font-size: 1.25rem; font-weight: 700; margin-bottom: 0.25rem; }
    .panel-subtitle { font-size: 0.875rem; color: #6a7588; margin-bottom: 2rem; }
    .demo-section { margin-bottom: 2rem; }
    .demo-section-header { font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: #6a7588; margin-bottom: 1rem; padding-bottom: 0.375rem; border-bottom: 1px solid #e5e5e5; }
    .demo-section-body { display: flex; flex-wrap: wrap; align-items: center; gap: 0.75rem; }
    ui5-button { --sapButton_FontFamily: "72", sans-serif; }
    ui5-button::part(text) { font-family: "72", sans-serif; font-weight: 400; }
  </style>
</head>
<body>

  <div class="panel-title">Menu</div>
  <div class="panel-subtitle">A contextual list of actions opened by a button. Supports icons, submenus, disabled items, and separators.</div>

  <div class="demo-section">
    <div class="demo-section-header">Basic Menu</div>
    <div class="demo-section-body">
      <ui5-button id="menu-btn-1" design="Default">Open Menu</ui5-button>
      <ui5-menu id="menu-1" opener="menu-btn-1">
        <ui5-menu-item text="New File" icon="add-document"></ui5-menu-item>
        <ui5-menu-item text="New Folder" icon="add-folder"></ui5-menu-item>
        <ui5-menu-item text="Open" icon="open-folder"></ui5-menu-item>
        <ui5-menu-item text="Save" icon="save"></ui5-menu-item>
        <ui5-menu-item text="Delete" icon="delete" disabled></ui5-menu-item>
      </ui5-menu>
    </div>
  </div>

  <div class="demo-section">
    <div class="demo-section-header">With Submenus</div>
    <div class="demo-section-body">
      <ui5-button id="menu-btn-2" design="Default" icon="slim-arrow-down" icon-end>Actions</ui5-button>
      <ui5-menu id="menu-2" opener="menu-btn-2">
        <ui5-menu-item text="Create" icon="add">
          <ui5-menu-item text="New Order" icon="sales-order"></ui5-menu-item>
          <ui5-menu-item text="New Invoice" icon="document"></ui5-menu-item>
          <ui5-menu-item text="New Contact" icon="employee"></ui5-menu-item>
        </ui5-menu-item>
        <ui5-menu-item text="Export" icon="download">
          <ui5-menu-item text="Export as PDF" icon="pdf-attachment"></ui5-menu-item>
          <ui5-menu-item text="Export as Excel" icon="excel-attachment"></ui5-menu-item>
          <ui5-menu-item text="Export as CSV" icon="document-text"></ui5-menu-item>
        </ui5-menu-item>
        <ui5-menu-item text="Print" icon="print"></ui5-menu-item>
        <ui5-menu-item text="Archive" icon="filing-cabinet" disabled></ui5-menu-item>
      </ui5-menu>
    </div>
  </div>

  <div class="demo-section">
    <div class="demo-section-header">Context Menu (Right-Click)</div>
    <div class="demo-section-body" style="width:100%;">
      <div id="ctx-target" style="border:2px dashed #e5e5e5;border-radius:6px;padding:1.5rem;text-align:center;font-size:0.875rem;color:#6a7588;cursor:context-menu;user-select:none;width:100%;">
        Right-click or long-press here to open context menu
      </div>
      <ui5-menu id="menu-ctx">
        <ui5-menu-item text="Cut" icon="scissors"></ui5-menu-item>
        <ui5-menu-item text="Copy" icon="copy"></ui5-menu-item>
        <ui5-menu-item text="Paste" icon="paste"></ui5-menu-item>
        <ui5-menu-item text="Select All" icon="multiselect-all"></ui5-menu-item>
      </ui5-menu>
    </div>
  </div>

  <script>
    document.getElementById('menu-btn-1').addEventListener('click', function() { document.getElementById('menu-1').open = true; });
    document.getElementById('menu-btn-2').addEventListener('click', function() { document.getElementById('menu-2').open = true; });
    document.getElementById('ctx-target').addEventListener('contextmenu', function(e) {
      e.preventDefault();
      var m = document.getElementById('menu-ctx');
      m.opener = 'ctx-target';
      m.open = true;
    });
  </script>

</body>
</html>
