<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <script src="panel-init.js"></script>
  <script type="module" src="../../../lib/ui5-bundle/ui5-bundle.js"></script>
  <style>
    @font-face { font-family: "72"; font-weight: 400; src: url("https://cdn.jsdelivr.net/npm/@sap-theming/theming-base-content@11.33.0/content/Base/baseLib/baseTheme/fonts/72-Regular.woff2") format("woff2"); }
    @font-face { font-family: "72"; font-weight: 700; src: url("https://cdn.jsdelivr.net/npm/@sap-theming/theming-base-content@11.33.0/content/Base/baseLib/baseTheme/fonts/72-Bold.woff2") format("woff2"); }
    body { font-family: "72", sans-serif; font-size: 0.875rem; background: #f5f6f7; color: #131e29; margin: 0; padding: 2rem; }
    .panel-title { font-size: 1.25rem; font-weight: 700; margin-bottom: 0.25rem; }
    .panel-subtitle { font-size: 0.875rem; color: #6a7588; margin-bottom: 2rem; }
    .demo-section { margin-bottom: 2rem; }
    .demo-section-header { font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: #6a7588; margin-bottom: 1rem; padding-bottom: 0.375rem; border-bottom: 1px solid #e5e5e5; }
    .demo-section-body { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 1rem; }
    .col { display: flex; flex-direction: column; gap: 0.5rem; }
  </style>
</head>
<body>
  <div class="panel-title">Radio Button</div>
  <div class="panel-subtitle">Allows the user to select a single option from a group.</div>

  <div class="demo-section">
    <div class="demo-section-header">Basic Group</div>
    <div class="demo-section-body">
      <div class="col">
        <ui5-radio-button name="priority" text="High" checked></ui5-radio-button>
        <ui5-radio-button name="priority" text="Medium"></ui5-radio-button>
        <ui5-radio-button name="priority" text="Low"></ui5-radio-button>
      </div>
    </div>
  </div>

  <div class="demo-section">
    <div class="demo-section-header">Value State</div>
    <div class="demo-section-body">
      <div class="col">
        <ui5-radio-button name="state" text="None" value-state="None" checked></ui5-radio-button>
        <ui5-radio-button name="state" text="Positive" value-state="Positive"></ui5-radio-button>
        <ui5-radio-button name="state" text="Critical" value-state="Critical"></ui5-radio-button>
        <ui5-radio-button name="state" text="Negative" value-state="Negative"></ui5-radio-button>
        <ui5-radio-button name="state" text="Information" value-state="Information"></ui5-radio-button>
      </div>
    </div>
  </div>

  <div class="demo-section">
    <div class="demo-section-header">Disabled &amp; Read-only</div>
    <div class="demo-section-body">
      <div class="col">
        <ui5-radio-button name="disabled1" text="Disabled unchecked" disabled></ui5-radio-button>
        <ui5-radio-button name="disabled2" text="Disabled checked" disabled checked></ui5-radio-button>
        <ui5-radio-button name="readonly1" text="Read-only unchecked" readonly></ui5-radio-button>
        <ui5-radio-button name="readonly2" text="Read-only checked" readonly checked></ui5-radio-button>
      </div>
    </div>
  </div>

  <div class="demo-section">
    <div class="demo-section-header">Horizontal Layout</div>
    <div class="demo-section-body" style="flex-direction: row; gap: 1.5rem;">
      <ui5-radio-button name="horiz" text="Draft" checked></ui5-radio-button>
      <ui5-radio-button name="horiz" text="In Review"></ui5-radio-button>
      <ui5-radio-button name="horiz" text="Approved"></ui5-radio-button>
      <ui5-radio-button name="horiz" text="Rejected"></ui5-radio-button>
    </div>
  </div>
</body>
</html>
