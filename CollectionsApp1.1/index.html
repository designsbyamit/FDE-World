abel>Promises due or broken</label><strong>${mine.filter(a=>a.promises.some(p=>p.status==='Broken'||p.date==='2026-10-14')).length||1} <span class="small muted">to check</span></strong></div><div class="metricicon" style="background:var(--amberbg);color:var(--amber)">◷</div></div></div><div class="panel"><div class="phead"><div><h2>Priority worklist</h2><p>Sorted by what is most likely to unblock payment.</p></div><button class="btn" onclick="s.page='group';s.focus='group';draw()">View group portfolio ↗</button></div><div class="filters">${['All','Action today','Promise due/broken','Dispute','Overdue 90+','Unassigned'].map(f=>`<button class="chip ${s.filter===f?'active':''}" data-filter="${f}">${f}</button>`).join('')}</div><div class="tablewrap"><table><thead><tr><th>Customer / BP</th><th>Company code</th><th>Overdue</th><th>Oldest</th><th>Next action / reason</th><th>Last contact</th><th></th></tr></thead><tbody>${r.length?r.map(a=>`<tr><td><div class="cust"><div class="logo">${a.ini}</div><div><div class="cname" onclick="openCust('${a.id}')">${a.name}</div><div class="meta">BP ${a.id}</div></div></div></td><td>${a.code}</td><td class="money">${money(a.balance)}</td><td>${a.age?`<span class="badge ${a.age>=90?'red':a.age>=60?'amber':'blue'}">${a.age} days</span>`:'<span class="badge green">Current</span>'}</td><td><div class="reason"><span class="dot ${['broken','risk'].includes(a.status)?'red':a.status==='followup'||a.status==='invoice'?'blue':''}"></span>${a.reason}</div></td><td>${a.last}</td><td><button class="openbtn" onclick="openCust('${a.id}')">Open</button></td></tr>`).join(''):`<tr><td colspan="7" class="muted">No matching customers. <button class="btn" onclick="s.filter='All';s.query='';draw()">Clear filters</button></td></tr>`}</tbody></table></div></div><div class="split"><div class="panel"><div class="phead"><div><h2>Today’s focus</h2><p>A short queue to help you decide what to do next.</p></div><span class="badge blue">3 recommended</span></div><div style="padding:4px 17px">${[['1','Acme Industrial','Broken €60K promise · confirm revised payment date','100123','Follow up'],['2','Global Foods','Customer requested invoice copies · 2 invoices','100207','Send copies'],['3','Delta Manufacturing','Follow-up due today · chase step 2 of 3','100412','Send email']].map(x=>`<div class="focusrow"><div class="fnum">${x[0]}</div><div class="ftext"><b>${x[1]}</b><p>${x[2]}</p></div><button class="faction" onclick="openCust('${x[3]}')">${x[4]} →</button></div>`).join('')}</div></div><div class="hint"><b>✧ Why these priorities?</b><p>Priority blends overdue age, balance, broken promises, disputes and chase cadence. Every recommendation includes a reason you can inspect before acting.</p><a onclick="toast('Recommendations are suggestions. You remain in control of every action.')">How prioritisation works →</a></div></div><div class="footerhint">Fictional demo data · Actions update local prototype state. No live SAP data or customer emails are connected.</div>`}
function invMarkup(a,all){return `<div class="invrow invhead"><span>Invoice</span><span>Due date</span><span>Amount</span><span>Status</span></div>${(all?a.invoices:a.invoices.slice(0,3)).map(i=>`<div class="invrow"><div><b>${i[0]}</b><div class="meta">${i[3]} days overdue</div></div><span>${fmt(i[1])}</span><b>${money(i[2])}</b><span class="ivstatus badge ${i[4]==='Disputed'?'amber':'red'}">${i[4]}</span></div>`).join('')||'<p class="muted">No open invoices in this demo account.</p>'}`}function eventMarkup(a){return [...a.events,...(s.extra[a.id]||[])].map(e=>`<div class="event"><div class="eventicon">${e[3]||'•'}</div><div><b>${e[0]}</b><p>${e[1]}</p><time>${e[2]}</time></div></div>`).join('')}function detail(){let a=acc(s.selected);if(!a)return home();let tabs=['Overview','Open invoices','Activity','Promises','Disputes'];let body=s.tab==='Open invoices'?invMarkup(a,true)+`<button class="btn" onclick="modal('email','${a.id}','invoice')">✉ Send invoice copies</button>`:s.tab==='Activity'?eventMarkup(a)+`<button class="btn" onclick="modal('note','${a.id}')">＋ Log call or note</button>`:s.tab==='Promises'?`${a.promises.map(p=>`<div class="focusrow"><div class="fnum">${p.status==='Broken'?'!':'✓'}</div><div class="ftext"><b>${money(p.amount)} · ${p.status}</b><p>${p.invoice} · Promise date ${fmt(p.date)}</p></div></div>`).join('')||'<p class="muted">No promises to pay recorded.</p>'}<button class="btn" onclick="modal('ptp','${a.id}')">＋ Record promise to pay</button>`:s.tab==='Disputes'?`<p class="muted">Capture a structured reason against an invoice so the issue can be routed and tracked.</p><button class="btn" onclick="modal('dispute','${a.id}')">＋ Capture dispute</button>${[...a.events,...(s.extra[a.id]||[])].filter(e=>e[0].toLowerCase().includes('dispute')).map(e=>`<p>${e[0]}: ${e[1]}</p>`).join('')}`:invMarkup(a,false)+`<button class="btn ghost" onclick="s.tab='Open invoices';draw()">View all open invoices →</button>`;let suggestion=a.status==='invoice'?'Send requested invoice copies':a.status==='dispute'?'Review dispute on invoice':a.status==='broken'?'Follow up on broken promise':a.status==='risk'?'Request escalation review':a.status==='paid'?'Review next-cycle terms':a.status==='promise'?'Monitor promised payment':'Send payment follow-up';return `<button class="back" onclick="s.page=s.focus==='group'?'group':'worklist';draw()">← Back to ${s.focus==='group'?'Group Worklist':'My Worklist'}</button><div class="hero"><div class="heroid"><div class="biglogo">${a.ini}</div><div><div class="eyebrow">Customer 360 · BP ${a.id}</div><h1>${a.name}</h1><div class="sub">${a.seg} · Company code ${a.code} · Assigned to ${a.owner}</div></div></div><div class="heroactions"><button class="btn" onclick="modal('note','${a.id}')">Log contact</button><button class="btn" onclick="modal('ptp','${a.id}')">＋ Promise to pay</button><button class="btn primary" onclick="modal('email','${a.id}')">✉ Compose email</button></div></div><div class="mini"><div class="minicard"><label>Open overdue</label><strong>${money(a.balance)}</strong></div><div class="minicard"><label>Open items</label><strong>${a.invoices.length}</strong></div><div class="minicard"><label>Oldest aging</label><strong>${a.age?a.age+' days':'Current'}</strong></div><div class="minicard"><label>PTP fulfilment</label><strong>${a.ptp}</strong></div></div><div class="details"><div class="panel"><div class="tabs">${tabs.map(t=>`<button class="${s.tab===t?'active':''}" onclick="s.tab='${t}';draw()">${t}</button>`).join('')}</div><div class="tabbody">${body}</div></div><div><div class="sidecard"><div class="sidehead">✧ Recommended next action</div><div class="sidebody"><div class="recommend"><div class="eyebrow">Suggested action</div><h3>${suggestion}</h3><p>${a.reason}. ${a.payment}.</p><button class="btn primary" style="width:100%" onclick="primary('${a.id}')">Take action →</button></div><div class="exposure"><b>Why this action?</b><br>${a.reason}. Recommendation only. You stay in control.</div></div></div><div class="sidecard"><div class="sidehead">Customer signals</div><div class="sidebody"><div class="pair"><span>Payment pattern</span><b>${a.payment}</b></div><div class="pair"><span>Last contact</span><b>${a.last}</b></div><div class="pair"><span>Parent entity</span><b>${a.parent}</b></div><div class="pair"><span>Open promises</span><b>${a.promises.filter(p=>p.status==='Open').length}</b></div><div class="pair"><span>Current status</span>${badge(a)}</div><div class="exposure">ⓘ ${a.cross}</div></div></div><div class="sidecard"><div class="sidehead">Quick actions</div><div class="sidebody" style="display:grid;gap:7px"><button class="btn" onclick="modal('email','${a.id}','invoice')">▤ Send invoice copies</button><button class="btn" onclick="modal('schedule','${a.id}')">◷ Schedule follow-up</button><button class="btn" onclick="modal('dispute','${a.id}')">◇ Capture dispute</button><button class="btn" onclick="modal('escalate','${a.id}')">⚑ Request escalation</button><button class="btn ghost" onclick="payment('${a.id}')">✓ Demo: payment received</button></div></div></div></div><div class="footerhint">Visibility restricted to ${a.seg} / ${a.code}. Cross-segment exposure is read-only. All actions are simulated.</div>`}
function group(){let r=data.filter(a=>a.seg===s.segment);return `<div class="heading"><div><div class="eyebrow">Team portfolio · ${s.segment}</div><h1>Group Worklist</h1><div class="sub">See the group picture and help balance workload.</div></div><button class="btn primary" onclick="assign()">↗ Assign selected ${s.selectedIds.length?'('+s.selectedIds.length+')':''}</button></div><div class="metrics"><div class="metric"><div><label>Group overdue</label><strong>${money(r.reduce((n,a)=>n+a.balance,0))}</strong></div><div class="metricicon">▤</div></div><div class="metric"><div><label>Unassigned BPs</label><strong>${r.filter(a=>a.owner==='Unassigned').length}</strong></div><div class="metricicon">♙</div></div><div class="metric"><div><label>No recent activity</label><strong>${r.filter(a=>a.last.includes('Aug')||a.last.includes('Sep')).length}</strong></div><div class="metricicon">◷</div></div></div><div class="panel"><div class="phead"><div><h2>Group portfolio</h2><p>Group visibility does not imply individual assignment.</p></div><span class="badge blue">${r.length} business partners</span></div><div class="tablewrap"><table><thead><tr><th><input type="checkbox" onchange="selectAll(this.checked)"></th><th>Customer / BP</th><th>Overdue</th><th>Oldest</th><th>Assigned to</th><th>Signal</th><th></th></tr></thead><tbody>${r.map(a=>`<tr><td><input type="checkbox" ${s.selectedIds.includes(a.id)?'checked':''} onchange="selectOne('${a.id}',this.checked)"></td><td><div class="cust"><div class="logo">${a.ini}</div><div><div class="cname" onclick="openCust('${a.id}')">${a.name}</div><div class="meta">BP ${a.id}</div></div></div></td><td class="money">${money(a.balance)}</td><td><span class="badge ${a.age>=90?'red':a.age>=60?'amber':'blue'}">${a.age} days</span></td><td>${a.owner}</td><td>${a.owner==='Unassigned'?'<span class="badge amber">Needs owner</span>':a.last.includes('Aug')||a.last.includes('Sep')?'<span class="badge red">No recent activity</span>':badge(a)}</td><td><button class="openbtn" onclick="openCust('${a.id}')">Open</button></td></tr>`).join('')}</tbody></table></div></div><p class="footerhint">Assignment is simulated and limited to the selected segment in this prototype.</p>`}
function customers(){let r=data.filter(a=>a.seg===s.segment&&a.owner==='Alex Rivera');return `<div class="heading"><div><div class="eyebrow">Business partners</div><h1>Customers</h1><div class="sub">Search and open accounts within your current segment.</div></div></div><div class="panel"><div class="phead"><div><h2>Assigned business partners</h2><p>${s.segment} scope</p></div></div><div class="tablewrap"><table><thead><tr><th>Customer</th><th>BP ID</th><th>Company code</th><th>Overdue</th><th>Last contact</th><th></th></tr></thead><tbody>${r.map(a=>`<tr><td><b class="cname" onclick="openCust('${a.id}')">${a.name}</b></td><td>${a.id}</td><td>${a.code}</td><td class="money">${money(a.balance)}</td><td>${a.last}</td><td><button class="openbtn" onclick="openCust('${a.id}')">Open</button></td></tr>`).join('')}</tbody></table></div></div>`}
function calendar(){let all=data.filter(a=>a.seg===s.segment&&a.promises.length);return `<div class="heading"><div><div class="eyebrow">Follow-up planning</div><h1>Promise calendar</h1><div class="sub">Upcoming commitments and reminders to help prevent missed promises.</div></div><button class="btn primary" onclick="modal('schedule',s.selected)">＋ Schedule follow-up</button></div><div class="panel"><div class="phead"><div><h2>October 2026</h2><p>Demo week · promise dates and follow-ups</p></div></div><div class="calendar">${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(d=>`<div class="day" style="min-height:20px;text-align:center;font-weight:700;border:0;background:white">${d}</div>`).join('')}${[12,13,14,15,16,17,18].map(d=>`<div class="day"><b>${d}</b>${all.filter(a=>a.promises.some(p=>Number(p.date.slice(-2))===d)).map(a=>`<span class="task ${a.promises.some(p=>p.status==='Broken')?'broken':''}" onclick="openCust('${a.id}')">${a.name}<br>${money(a.promises[0].amount)}</span>`).join('')}${d===14?'<span class="task" onclick="modal(\'schedule\',null)">+ Add follow-up</span>':''}</div>`).join('')}</div></div><div class="panel" style="margin-top:15px"><div class="phead"><div><h2>Upcoming promises</h2><p>Current outstanding commitments</p></div></div><div class="tablewrap"><table><thead><tr><th>Customer</th><th>Amount</th><th>Date</th><th>Invoice</th><th>Status</th><th></th></tr></thead><tbody>${all.flatMap(a=>a.promises.map(p=>`<tr><td>${a.name}</td><td class="money">${money(p.amount)}</td><td>${fmt(p.date)}</td><td>${p.invoice}</td><td><span class="badge ${p.status==='Broken'?'red':'blue'}">${p.status}</span></td><td><button class="openbtn" onclick="openCust('${a.id}')">Open</button></td></tr>`)).join('')}</tbody></table></div></div>`}
function escalations(){let r=data.filter(a=>a.seg===s.segment&&['broken','risk','dispute'].includes(a.status));return `<div class="heading"><div><div class="eyebrow">Human-controlled decisions</div><h1>Escalations</h1><div class="sub">Review accounts that may need specialist or credit decision support.</div></div></div><div class="panel"><div class="phead"><div><h2>Recommended for review</h2><p>Suggestions do not execute a credit hold automatically.</p></div></div><div class="tablewrap"><table><thead><tr><th>Customer</th><th>Reason</th><th>Overdue</th><th>Last contact</th><th></th></tr></thead><tbody>${r.map(a=>`<tr><td><b class="cname" onclick="openCust('${a.id}')">${a.name}</b><div class="meta">BP ${a.id}</div></td><td>${a.reason}</td><td class="money">${money(a.balance)}</td><td>${a.last}</td><td><button class="openbtn" onclick="modal('escalate','${a.id}')">Review</button></td></tr>`).join('')}</tbody></table></div></div>`}
function draw(){let page=s.page;let content=page==='detail'?detail():page==='group'?group():page==='customers'?customers():page==='calendar'?calendar():page==='escalations'?escalations():home();$('app').innerHTML=`<div class="shell">${nav()}<main>${renderTop()}<div class="content">${content}</div></main></div>`;document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{s.page=b.dataset.page;s.filter='All';s.focus=s.page==='group'?'group':'mine';draw()});document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{s.filter=b.dataset.filter;draw()});$('segment').onchange=e=>{s.segment=e.target.value;s.page='worklist';s.selected=null;s.filter='All';s.query='';draw();toast('Context changed to '+s.segment+'. Company-code scope updated.')};$('search').oninput=e=>{let p=e.target.selectionStart;s.query=e.target.value;draw();let el=$('search');el.focus();el.setSelectionRange(p,p)};if(s.modal)renderModal()}
function openCust(id){s.selected=id;s.page='detail';s.tab='Overview';s.focus=s.page==='group'?'group':s.focus;draw()}function primary(id){let a=acc(id);modal(a.status==='invoice'?'email':a.status==='dispute'?'dispute':a.status==='risk'||a.status==='broken'?'escalate':a.status==='paid'?'note':'email',id,a.status==='invoice'?'invoice':undefined)}function addEvent(id,title,desc,ico='•'){if(!s.extra[id])s.extra[id]=[];s.extra[id].unshift([title,desc,'Just now · Demo',ico]);acc(id).events.unshift([title,desc,'Just now · Demo',ico])}
function modal(type,id,mode){s.modal={type,id,mode};renderModal()}function closeModal(){s.modal=null;let el=$('modalbg');if(el)el.remove()}function renderModal(){let m=s.modal;if(!m)return;let a=acc(m.id),title='',body='',foot='';const inv=()=>a&&a.invoices.length?`<div class="field"><label>Invoice references</label><div style="display:grid;gap:7px">${a.invoices.map((i,n)=>`<label style="font-weight:400"><input type="checkbox" name="invoice" value="${i[0]}" ${n===0?'checked':''}> ${i[0]} · ${money(i[2])} · ${i[3]} days overdue</label>`).join('')}</div></div>`:'<p class="muted">No open invoices in this demo account.</p>';if(m.type==='email'){title='Compose customer email';let templ=m.mode==='invoice'?'Invoice copies requested':'Payment reminder';body=`<div style="display:flex;gap:5px;flex-wrap:wrap;margin-bottom:13px">${['Payment reminder','Broken promise follow-up','Invoice copies requested','Statement of account','Dispute acknowledgement'].map(t=>`<button class="chip ${t===templ?'active':''}" type="button" onclick="template('${t}')">${t}</button>`).join('')}</div><form id="form"><div class="field"><label>To</label><input name="to" type="email" required value="${a?.email||'finance@example.com'}"></div><div class="field"><label>Subject</label><input id="subject" name="subject" required value="${templ==='Invoice copies requested'?'Requested invoice copies':'Payment reminder: outstanding invoices'}"></div>${inv()}<div class="field"><label>Message</label><textarea id="emailbody" name="body" required>Dear ${a?.name||'Customer'} team,

${templ==='Invoice copies requested'?'As requested, I am sharing the invoice references for your records. Please let me know if you need anything else.':'I am following up on the outstanding invoices listed below. Could you please confirm the expected payment date, or let us know if you need supporting information?'}

Thank you,
Alex Rivera</textarea></div><div class="hint"><b>✧ Draft assistance</b><p>Suggested wording based on this customer context. Edit it before use. Sending is simulated and no external email will be sent.</p><a onclick="template('Payment reminder')">Regenerate draft →</a></div></form>`;foot=`<button class="btn" onclick="closeModal()">Cancel</button><button class="btn" onclick="copyDraft()">Copy email</button><button class="btn primary" onclick="submit()">Simulate send email</button>`}else if(m.type==='ptp'){title='Record promise to pay';body=`<form id="form"><div class="formgrid"><div class="field"><label>Promised amount (€)</label><input type="number" name="amount" min="1" max="${a?.balance||9999999}" required value="${Math.min(50000,a?.balance||50000)}"></div><div class="field"><label>Promise date</label><input type="date" name="date" required value="2026-10-20"></div></div>${inv()}<div class="field"><label>Commitment type</label><select name="commitment"><option>Partial payment</option><option>Full balance</option></select></div><div class="field"><label>Notes</label><textarea name="notes" placeholder="Context from customer conversation"></textarea></div></form>`;foot=`<button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="submit()">Save promise & schedule follow-up</button>`}else if(m.type==='dispute'){body=`<form id="form">${a&&a.invoices.length?`<div class="field"><label>Invoice</label><select name="invoice">${a.invoices.map(i=>`<option value="${i[0]}">${i[0]} · ${money(i[2])}</option>`).join('')}</select></div>`:''}<div class="field"><label>Dispute reason</label><select name="reason"><option>Missing invoice</option><option>Pricing discrepancy</option><option>Goods not received</option><option>Payment already made</option><option>Tax issue</option><option>Other</option></select></div><div class="field"><label>Customer explanation</label><textarea name="notes" required placeholder="Capture the specific issue and what is needed to resolve it."></textarea></div><div class="field"><label>Route to</label><select name="route"><option>Billing team</option><option>Order management</option><option>Cash application</option><option>Tax team</option></select></div></form>`;title='Capture a dispute';foot=`<button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="submit()">Create dispute case</button>`}else if(m.type==='schedule'){title='Schedule follow-up';body=`<form id="form"><div class="field"><label>Customer</label><select name="customer">${data.filter(x=>x.seg===s.segment).map(x=>`<option value="${x.id}" ${x.id===m.id?'selected':''}>${x.name}</option>`).join('')}</select></div><div class="formgrid"><div class="field"><label>Date</label><input name="date" type="date" required value="2026-10-15"></div><div class="field"><label>Time</label><input name="time" type="time" required value="10:00"></div></div><div class="formgrid"><div class="field"><label>Channel</label><select name="channel"><option>Email</option><option>Call</option><option>Review only</option></select></div><div class="field"><label>Reason</label><select name="reason"><option>Promise follow-up</option><option>Payment reminder</option><option>Invoice confirmation</option><option>Dispute status check</option><option>General follow-up</option></select></div></div><div class="field"><label>Notes</label><textarea name="notes" placeholder="What do you need to check?"></textarea></div></form>`;foot=`<button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="submit()">Schedule follow-up</button>`}else if(m.type==='note'){title='Log contact or note';body=`<form id="form"><div class="field"><label>Contact type</label><select name="kind"><option>Call logged</option><option>Contact note</option><option>Customer response</option><option>Internal note</option></select></div><div class="field"><label>Outcome / notes</label><textarea name="notes" required placeholder="What did the customer say? What happens next?"></textarea></div><div class="field"><label>Follow-up needed?</label><select name="follow"><option>No follow-up</option><option>Schedule follow-up</option></select></div></form>`;foot=`<button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="submit()">Save contact</button>`}else if(m.type==='escalate'){title='Request escalation review';body=`<div class="hint"><b>⚑ Review recommended</b><p>${a?.reason||'Account requires specialist review.'} This request does not place a credit hold automatically.</p></div><form id="form" style="margin-top:14px"><div class="field"><label>Escalation type</label><select name="kind"><option>Credit hold review</option><option>Senior collections specialist</option><option>Legal referral assessment</option><option>Supervisor review</option></select></div><div class="field"><label>Reason</label><textarea name="reason" required>${a?.reason||''}</textarea></div><div class="field"><label>Handoff summary</label><textarea name="summary" required>Customer: ${a?.name||''}. Outstanding: ${money(a?.balance||0)}. Last contact: ${a?.last||'Not available'}. Review payment history and next appropriate action.</textarea></div></form>`;foot=`<button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="submit()">Submit review request</button>`}else if(m.type==='assign'){title='Assign business partners';body=`<form id="form"><p>Assign ${m.ids.length} selected accounts to a collector within ${s.segment}.</p><div class="field"><label>Assign to</label><select name="owner"><option>Alex Rivera</option><option>Sam Patel</option><option>Priya Nair</option><option>Jordan Lee</option></select></div><p class="small muted">${m.ids.map(id=>acc(id)?.name).join(', ')}</p></form>`;foot=`<button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="submit()">Confirm assignment</button>`}let old=$('modalbg');if(old)old.remove();document.body.insertAdjacentHTML('beforeend',`<div class="modalbg" id="modalbg" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modalhead"><h2>${title}</h2><button class="close" onclick="closeModal()">×</button></div><div class="modalbody">${body}</div><div class="modalfoot">${foot}</div></div></div>`)}
function template(t){let a=acc(s.modal?.id);let subj=$('subject'),body=$('emailbody');if(subj)subj.value=t==='Invoice copies requested'?'Requested invoice copies':t==='Broken promise follow-up'?'Follow-up on missed payment commitment':t==='Statement of account'?'Statement of account':t==='Dispute acknowledgement'?'We have received your dispute':'Payment reminder: outstanding invoices';if(body)body.value=`Dear ${a?.name||'Customer'} team,\n\n${t==='Invoice copies requested'?'As requested, I am sharing the invoice references for your records. Please let me know if you need any supporting information.':t==='Broken promise follow-up'?'We are following up on the payment commitment that was due. Could you confirm the revised payment date or let us know if anything is preventing settlement?':t==='Statement of account'?'Please find the outstanding items on your account for your review. Let us know if any item needs clarification.':t==='Dispute acknowledgement'?'Thank you for raising this issue. We have recorded it for review and will coordinate with the appropriate team.':'I am following up on the outstanding invoices listed below. Could you please confirm the expected payment date?'}\n\nThank you,\nAlex Rivera`;document.querySelectorAll('.chip').forEach(e=>e.classList.toggle('active',e.textContent===t))}function copyDraft(){let text='To: '+$('form').to.value+'\nSubject: '+$('subject').value+'\n\n'+$('emailbody').value;if(navigator.clipboard)navigator.clipboard.writeText(text).then(()=>toast('Email draft copied.')).catch(()=>toast('Copy the draft text manually.'));else toast('Copy the draft text manually.')}function submit(){let f=$('form');if(f&&!f.reportValidity())return;let fd=f?new FormData(f):new FormData(),d=Object.fromEntries(fd.entries()),m=s.modal,id=m.id,a=acc(id);if(m.type==='schedule'){id=d.customer;a=acc(id);addEvent(id,'Follow-up scheduled',`${d.reason} · ${d.date} ${d.time} via ${d.channel}`,'◷');a.reason=`${d.reason} · ${fmt(d.date)}`;closeModal();draw();toast('Follow-up scheduled for '+a.name+'.');return}if(m.type==='assign'){m.ids.forEach(cid=>{let x=acc(cid);x.owner=d.owner;addEvent(cid,'Assignment changed','Assigned to '+d.owner+' by Alex Rivera','↗')});s.selectedIds=[];closeModal();draw();toast('Accounts assigned to '+d.owner+'.');return}if(!a){closeModal();toast('Saved in prototype.');return}let chosen=f?[...f.querySelectorAll('input[name="invoice"]:checked')].map(e=>e.value):[];if(m.type==='email'){addEvent(id,'Email prepared (simulated)',`${d.subject}${chosen.length?' · '+chosen.join(', '):''} · No external email sent`,'✉');a.last='Just now';if(a.status==='invoice')a.status='followup';closeModal();draw();toast('Email action simulated and added to activity. No email was sent externally.')}else if(m.type==='ptp'){let amount=Number(d.amount);if(a.balance&&amount>a.balance){toast('Promise amount exceeds overdue balance.');return}a.promises.unshift({amount,date:d.date,invoice:chosen.join(', ')||'Account balance',status:'Open'});a.status='promise';a.reason='Promise to pay recorded · due '+fmt(d.date);addEvent(id,'Promise to pay recorded',`${money(amount)} promised by ${fmt(d.date)} · ${d.commitment}${d.notes?' · '+d.notes:''}`,'✓');closeModal();draw();toast('Promise saved. Follow-up is scheduled for the promise date.')}else if(m.type==='dispute'){let invoice=d.invoice||chosen[0]||'Account';let item=a.invoices.find(i=>i[0]===invoice);if(item)item[4]='Disputed';a.status='dispute';a.reason='Dispute: '+d.reason;addEvent(id,'Dispute captured',`${d.reason} · ${invoice} · Routed to ${d.route}. ${d.notes}`,'◇');closeModal();draw();toast('Dispute captured and added to activity.')}else if(m.type==='note'){addEvent(id,d.kind,d.notes,'☎');a.last='Just now';if(d.follow==='Schedule follow-up'){closeModal();modal('schedule',id);toast('Contact saved. Schedule the follow-up.');return}closeModal();draw();toast('Contact note saved.')}else if(m.type==='escalate'){addEvent(id,'Escalation requested',`${d.kind} · ${d.reason} · ${d.summary}`,'⚑');closeModal();draw();toast('Escalation request recorded. No credit hold was applied.')}}function payment(id){let a=acc(id);let amount=a.balance;a.balance=0;a.age=0;a.status='paid';a.reason='Payment received · review account';a.invoices=[];addEvent(id,'Payment received (simulated)',`${money(amount)} marked settled in demo state. No live AR posting occurred.`,'✓');draw();toast('Demo payment recorded. Priority has reduced.')}function selectOne(id,on){s.selectedIds=on?[...new Set([...s.selectedIds,id])]:s.selectedIds.filter(x=>x!==id);draw()}function selectAll(on){s.selectedIds=on?data.filter(a=>a.seg===s.segment).map(a=>a.id):[];draw()}function assign(){if(!s.selectedIds.length){toast('Select one or more accounts first.');return}s.modal={type:'assign',ids:[...s.selectedIds]};renderModal()}
draw();
</script></body></html>
