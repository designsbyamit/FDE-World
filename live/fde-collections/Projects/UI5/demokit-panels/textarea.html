<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <script src="panel-init.js"></script>
  <script type="module" src="../../../lib/ui5-bundle/ui5-bundle.js"></script>
  <style>
    @font-face { font-family: "72"; font-weight: 400; src: url("https://cdn.jsdelivr.net/npm/@sap-theming/theming-base-content@11.33.0/content/Base/baseLib/baseTheme/fonts/72-Regular.woff2") format("woff2"); }
    @font-face { font-family: "72"; font-weight: 700; src: url("https://cdn.jsdelivr.net/npm/@sap-theming/theming-base-content@11.33.0/content/Base/baseLib/baseTheme/fonts/72-Bold.woff2") format("woff2"); }
    body { font-family: "72", sans-serif; font-size: 0.875rem; background: #f5f6f7; color: #131e29; margin: 0; padding: 2rem; }
    .panel-title { font-size: 1.25rem; font-weight: 700; margin-bottom: 0.25rem; }
    .panel-subtitle { font-size: 0.875rem; color: #6a7588; margin-bottom: 2rem; }
    .demo-section { margin-bottom: 2rem; }
    .demo-section-header { font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: #6a7588; margin-bottom: 1rem; padding-bottom: 0.375rem; border-bottom: 1px solid #e5e5e5; }
    .demo-section-body { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 1rem; }
    ui5-textarea { width: 360px; }
  </style>
</head>
<body>
  <div class="panel-title">Text Area</div>
  <div class="panel-subtitle">A multi-line text input for longer freeform content such as notes or descriptions.</div>

  <div class="demo-section">
    <div class="demo-section-header">Basic</div>
    <div class="demo-section-body">
      <ui5-textarea placeholder="Enter a description…" rows="4"></ui5-textarea>
      <ui5-textarea value="This purchase order was submitted after the quarterly review meeting. Vendor has confirmed delivery within 10 business days." rows="4"></ui5-textarea>
    </div>
  </div>

  <div class="demo-section">
    <div class="demo-section-header">Value States</div>
    <div class="demo-section-body">
      <ui5-textarea value-state="Positive" value="Delivery notes approved and filed." rows="3" placeholder="Positive"></ui5-textarea>
      <ui5-textarea value-state="Critical" value="Field requires review before submission." rows="3" placeholder="Critical">
        <div slot="valueStateMessage">Please review the content before continuing.</div>
      </ui5-textarea>
      <ui5-textarea value-state="Negative" rows="3" placeholder="Negative — required field">
        <div slot="valueStateMessage">This field is required.</div>
      </ui5-textarea>
    </div>
  </div>

  <div class="demo-section">
    <div class="demo-section-header">With Character Counter</div>
    <div class="demo-section-body">
      <ui5-textarea placeholder="Add a comment (max 200 characters)…" rows="4" max-length="200" show-exceeded-text value="Short note about the approval workflow status."></ui5-textarea>
    </div>
  </div>

  <div class="demo-section">
    <div class="demo-section-header">Disabled &amp; Read-only</div>
    <div class="demo-section-body">
      <ui5-textarea disabled value="This field is disabled and cannot be edited." rows="3"></ui5-textarea>
      <ui5-textarea readonly value="Read-only: This content was auto-generated by the system." rows="3"></ui5-textarea>
    </div>
  </div>
</body>
</html>
