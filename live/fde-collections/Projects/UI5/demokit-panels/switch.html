<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <script src="panel-init.js"></script>
  <script type="module" src="../../../lib/ui5-bundle/ui5-bundle.js"></script>
  <style>
    @font-face { font-family: "72"; font-weight: 400; src: url("https://cdn.jsdelivr.net/npm/@sap-theming/theming-base-content@11.33.0/content/Base/baseLib/baseTheme/fonts/72-Regular.woff2") format("woff2"); }
    @font-face { font-family: "72"; font-weight: 700; src: url("https://cdn.jsdelivr.net/npm/@sap-theming/theming-base-content@11.33.0/content/Base/baseLib/baseTheme/fonts/72-Bold.woff2") format("woff2"); }
    body { font-family: "72", sans-serif; font-size: 0.875rem; background: #f5f6f7; color: #131e29; margin: 0; padding: 2rem; }
    .panel-title { font-size: 1.25rem; font-weight: 700; margin-bottom: 0.25rem; }
    .panel-subtitle { font-size: 0.875rem; color: #6a7588; margin-bottom: 2rem; }
    .demo-section { margin-bottom: 2rem; }
    .demo-section-header { font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: #6a7588; margin-bottom: 1rem; padding-bottom: 0.375rem; border-bottom: 1px solid #e5e5e5; }
    .demo-section-body { display: flex; flex-wrap: wrap; align-items: center; gap: 1.5rem; }
    .switch-row { display: flex; align-items: center; gap: 0.75rem; }
    .switch-label { font-size: 0.875rem; min-width: 140px; }
  </style>
</head>
<body>
  <div class="panel-title">Switch</div>
  <div class="panel-subtitle">A binary toggle control for enabling or disabling a setting.</div>

  <div class="demo-section">
    <div class="demo-section-header">Basic States</div>
    <div class="demo-section-body" style="flex-direction:column; align-items:flex-start;">
      <div class="switch-row"><span class="switch-label">Off (default)</span><ui5-switch></ui5-switch></div>
      <div class="switch-row"><span class="switch-label">On (checked)</span><ui5-switch checked></ui5-switch></div>
      <div class="switch-row"><span class="switch-label">Disabled off</span><ui5-switch disabled></ui5-switch></div>
      <div class="switch-row"><span class="switch-label">Disabled on</span><ui5-switch disabled checked></ui5-switch></div>
    </div>
  </div>

  <div class="demo-section">
    <div class="demo-section-header">With Text Labels</div>
    <div class="demo-section-body" style="flex-direction:column; align-items:flex-start;">
      <div class="switch-row">
        <span class="switch-label">Notifications</span>
        <ui5-switch checked text-on="On" text-off="Off"></ui5-switch>
      </div>
      <div class="switch-row">
        <span class="switch-label">Dark Mode</span>
        <ui5-switch text-on="On" text-off="Off"></ui5-switch>
      </div>
      <div class="switch-row">
        <span class="switch-label">Auto-sync</span>
        <ui5-switch checked text-on="Enabled" text-off="Disabled"></ui5-switch>
      </div>
    </div>
  </div>

  <div class="demo-section">
    <div class="demo-section-header">Design Variants</div>
    <div class="demo-section-body" style="flex-direction:column; align-items:flex-start;">
      <div class="switch-row"><span class="switch-label">Default</span><ui5-switch checked></ui5-switch></div>
      <div class="switch-row"><span class="switch-label">Graphical</span><ui5-switch design="Graphical" checked></ui5-switch></div>
    </div>
  </div>
</body>
</html>
