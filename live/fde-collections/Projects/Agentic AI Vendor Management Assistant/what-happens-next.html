<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="../../lib/assets/favicon.ico">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>What Happens Next</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Inter', system-ui, sans-serif;
    }
    .card {
      width: 600px;
      background: #1a1a2e;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 16px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.5);
      padding: 2.5rem;
    }
    .card-title {
      font-size: 30px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 1rem;
      line-height: 1.3;
    }
    .card-body {
      font-size: 25px;
      color: rgba(255,255,255,0.82);
      line-height: 1.55;
      margin-bottom: 2rem;
    }
    .card-divider {
      height: 1px;
      background: rgba(255,255,255,0.1);
      margin-bottom: 2rem;
    }
    .persona {
      display: flex;
      align-items: center;
      gap: 1.5rem;
      margin-bottom: 2rem;
    }
    .persona-avatar {
      width: 76px; height: 76px;
      border-radius: 50%;
      background: linear-gradient(135deg, #7c3aed, #a855f7);
      display: flex; align-items: center; justify-content: center;
      font-size: 26px;
      font-weight: 700;
      color: #fff;
      flex-shrink: 0;
    }
    .persona-name {
      font-size: 26px;
      font-weight: 600;
      color: #fff;
      line-height: 1.3;
    }
    .persona-role {
      font-size: 23px;
      color: rgba(255,255,255,0.7);
      margin-top: 0.2rem;
    }
    .btn {
      width: 100%;
      font-family: 'Inter', sans-serif;
      font-size: 26px;
      font-weight: 600;
      color: #fff;
      background: #7c3aed;
      border: none;
      border-radius: 8px;
      padding: 1.2rem 1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      transition: background 0.15s;
    }
    .btn:hover { background: #6d28d9; }
  </style>
</head>
<body>
  <div class="card">
    <div class="card-title">Meanwhile, at BestRun HQ&hellip;</div>
    <div class="card-body">Linda Wei is the Director of Vendor Management at BestRun. She has just received an email requesting her review of the submitted changes.</div>
    <div class="card-divider"></div>
    <div class="persona">
      <div class="persona-avatar" id="avatar">LW</div>
      <div>
        <div class="persona-name" id="personaName">Linda Wei</div>
        <div class="persona-role" id="personaRole">Vendor Management Director<br>BestRun</div>
      </div>
    </div>
    <button class="btn" id="inboxBtn">View her inbox &nbsp;&rarr;</button>
  </div>

  <script>
    var params = new URLSearchParams(window.location.search);
    var name = params.get('name') || 'Linda Wei';
    var initials = params.get('initials') || 'LW';
    var changes = params.get('changes') || '';
    var attachments = params.get('attachments') || '';

    document.getElementById('personaName').textContent = name;
    document.getElementById('avatar').textContent = initials;

    document.getElementById('inboxBtn').addEventListener('click', function() {
      var dest = 'email-action-required.html?name=' + encodeURIComponent(name);
      if (changes) dest += '&changes=' + encodeURIComponent(changes);
      if (attachments) dest += '&attachments=' + encodeURIComponent(attachments);
      window.location.href = dest;
    });
  </script>
</body>
</html>
