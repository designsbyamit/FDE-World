<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FDE World</title>
<style>
  :root { --bg:#f6f7f9; --fg:#1d2d3e; --muted:#5b6b7b; --card:#fff; --line:#d9dde3; --live:#107e3e; --staging:#b45309; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#12171d; --fg:#e8edf2; --muted:#9aa8b6; --card:#1b232c; --line:#2c3844; --live:#4cc27a; --staging:#f0a44b; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font-family:"72", system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width:720px; margin:0 auto; padding:64px 16px; }
  h1 { margin:0 0 4px; font-size:2rem; }
  .lede { margin:0 0 32px; color:var(--muted); }
  .grid { display:grid; gap:16px; grid-template-columns:repeat(auto-fit, minmax(240px, 1fr)); }
  a.card { display:block; padding:24px; background:var(--card); border:1px solid var(--line); border-top:4px solid var(--c); border-radius:12px; color:inherit; text-decoration:none; transition:transform .15s, box-shadow .15s; }
  a.card:hover { transform:translateY(-3px); box-shadow:0 8px 24px rgba(0,0,0,.12); }
  a.card h2 { margin:0 0 6px; font-size:1.25rem; color:var(--c); }
  a.card p { margin:0; color:var(--muted); font-size:.9375rem; line-height:1.45; }
  .live { --c:var(--live); }
  .staging { --c:var(--staging); }
</style>
</head>
<body>
<main>
  <h1>FDE World</h1>
  <p class="lede">Choose an environment.</p>
  <div class="grid">
    <a class="card live" href="live/"><h2>Live</h2><p>Published, reviewed work.</p></a>
    <a class="card staging" href="staging/"><h2>Staging</h2><p>Work in progress, for review before it goes live.</p></a>
  </div>
</main>
</body>
</html>
